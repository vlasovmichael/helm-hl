<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
    <title>Strategies · HL Scanner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Тему ставим до отрисовки, чтобы не мигало (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem("hl-scanner-theme") || "auto";
          var theme =
            stored === "auto"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored === "light"
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <nav class="topnav" aria-label="Primary">
        <a class="topnav-brand" href="/">HL&nbsp;Scanner</a>
        <div class="topnav-links">
          <a class="nav-link" href="/">
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="9" rx="1" />
              <rect x="14" y="3" width="7" height="5" rx="1" />
              <rect x="14" y="12" width="7" height="9" rx="1" />
              <rect x="3" y="16" width="7" height="5" rx="1" />
            </svg>
            Dashboard
          </a>
          <a class="nav-link active" href="/strategies.html" aria-current="page">
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="4" />
              <line x1="12" y1="1" x2="12" y2="5" />
              <line x1="12" y1="19" x2="12" y2="23" />
              <line x1="1" y1="12" x2="5" y2="12" />
              <line x1="19" y1="12" x2="23" y2="12" />
            </svg>
            Strategies
          </a>
          <a
            class="nav-link"
            href="/ledger.html"
            title="Monthly P&L ledger"
          >
            <svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5a2 2 0 0 1 2-2h12a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2z" />
              <line x1="4" y1="17" x2="19" y2="17" />
              <line x1="9" y1="3" x2="9" y2="21" />
            </svg>
            Ledger
          </a>
        </div>
        <div class="topnav-right">
          <div class="theme-switcher" role="group" aria-label="Theme">
            <button class="theme-btn" data-theme="auto" title="Auto (system)">
              Auto
            </button>
            <button class="theme-btn" data-theme="light" title="Light">
              Light
            </button>
            <button class="theme-btn" data-theme="dark" title="Dark">
              Dark
            </button>
          </div>
        </div>
      </nav>

      <section class="card" id="sec-strategies-placeholder">
        <div class="card-header">
          <div class="card-title" data-num="">Strategies</div>
        </div>
        <div class="empty-state">
          Per-strategy breakdown is coming here — P&amp;L, trade count and
          live state for Hunter SHORT and friends.
        </div>
      </section>
    </div>

    <script>
      // Standalone theme switch (без app.js).
      (function () {
        var KEY = "hl-scanner-theme";
        function resolve(mode) {
          return mode === "auto"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : mode;
        }
        function apply(mode) {
          document.documentElement.setAttribute("data-theme", resolve(mode));
          document.querySelectorAll(".theme-btn").forEach(function (b) {
            b.classList.toggle("active", b.dataset.theme === mode);
          });
        }
        var stored = localStorage.getItem(KEY) || "auto";
        apply(stored);
        document.querySelectorAll(".theme-btn").forEach(function (b) {
          b.addEventListener("click", function () {
            localStorage.setItem(KEY, b.dataset.theme);
            apply(b.dataset.theme);
          });
        });
      })();
    </script>
  </body>
</html>
