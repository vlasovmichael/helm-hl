<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
    <title>Edge · HL Scanner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hl-scanner-theme") || "auto";
          var theme = stored === "auto"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : stored === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {}
      })();
    </script>
    <style>
      /* ── Layout ───────────────────────────────────────────── */
      .edge-wrap {
        max-width: 680px;
        margin: 0 auto;
        padding: 16px 16px 40px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ── Header ───────────────────────────────────────────── */
      .edge-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .edge-title {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .edge-header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .refresh-badge {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-faint);
        min-width: 40px;
        text-align: right;
      }
      .theme-btn {
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        padding: 3px 7px;
        line-height: 1;
      }
      .theme-btn:hover { color: var(--text-primary); border-color: var(--border-strong); }

      /* ── Card ─────────────────────────────────────────────── */
      .edge-card {
        background: var(--card-bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .card-label {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 10px 14px 6px;
        border-bottom: 1px solid var(--hairline);
      }

      /* ── Macro ────────────────────────────────────────────── */
      .macro-row {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 12px 14px;
        flex-wrap: wrap;
      }
      .macro-coin {
        display: flex;
        align-items: baseline;
        gap: 7px;
      }
      .macro-name {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .macro-pct {
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: 700;
        line-height: 1;
      }
      .macro-pct.up { color: var(--green); }
      .macro-pct.dn { color: var(--red); }
      .macro-pct.flat { color: var(--text-muted); }
      .macro-label {
        font-size: 10px;
        color: var(--text-faint);
        margin-left: 2px;
        font-family: var(--font-mono);
      }
      .macro-verdict {
        margin-left: auto;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 4px;
        letter-spacing: 0.04em;
      }
      .macro-verdict.bull {
        background: var(--green-soft);
        color: var(--green);
      }
      .macro-verdict.bear {
        background: var(--red-soft);
        color: var(--red);
      }
      .macro-verdict.mixed {
        background: var(--warn-soft);
        color: var(--warn);
      }

      /* ── Setups table ─────────────────────────────────────── */
      .setup-table {
        width: 100%;
        border-collapse: collapse;
      }
      .setup-table th {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 6px 10px 6px;
        text-align: left;
        border-bottom: 1px solid var(--hairline);
      }
      .setup-table th:not(:first-child) { text-align: right; }
      .setup-table td {
        font-family: var(--font-mono);
        font-size: 13px;
        padding: 9px 10px;
        border-bottom: 1px solid var(--hairline);
        vertical-align: middle;
      }
      .setup-table tr:last-child td { border-bottom: none; }
      .setup-table td:not(:first-child) { text-align: right; }
      .setup-table tr.conflict-row td { background: rgba(248, 81, 73, 0.04); }

      .coin-cell { display: flex; align-items: center; gap: 6px; }
      .coin-name { font-weight: 700; font-size: 14px; color: var(--text-primary); }
      .dir-badge {
        font-size: 9px;
        font-weight: 700;
        padding: 2px 5px;
        border-radius: 3px;
        letter-spacing: 0.05em;
      }
      .dir-badge.long { background: var(--green-soft); color: var(--green); }
      .dir-badge.short { background: var(--red-soft); color: var(--red); }

      .score-dots { display: flex; gap: 3px; justify-content: flex-end; align-items: center; }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--border-strong);
      }
      .dot.filled { background: var(--accent-strong); }
      .dot.filled.score4 { background: #f78166; }
      .dot.filled.score3 { background: var(--warn); }
      .dot.filled.score2 { background: var(--accent-strong); }

      .conflict-icon {
        font-size: 10px;
        color: var(--red);
        margin-left: 4px;
        vertical-align: middle;
        font-style: normal;
      }

      .funding-cell { font-weight: 600; }
      .funding-cell.extreme-neg { color: var(--green); }
      .funding-cell.extreme-pos { color: var(--red); }
      .funding-cell.normal { color: var(--text-secondary); }

      .signal-tags { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
      .sig-tag {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 3px;
        font-weight: 600;
        letter-spacing: 0.04em;
        background: var(--canvas-inset);
        color: var(--text-secondary);
        border: 1px solid var(--border-muted);
      }
      .sig-tag.active {
        background: var(--accent-soft);
        color: var(--accent-strong);
        border-color: var(--accent-line);
      }

      /* ── Hot Movers ───────────────────────────────────────── */
      .movers-list { padding: 0; }
      .mover-row {
        display: flex;
        align-items: center;
        padding: 9px 14px;
        border-bottom: 1px solid var(--hairline);
        gap: 10px;
      }
      .mover-row:last-child { border-bottom: none; }
      .mover-coin { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--text-primary); min-width: 60px; }
      .mover-pct { font-family: var(--font-mono); font-size: 14px; font-weight: 600; min-width: 64px; }
      .mover-pct.up { color: var(--green); }
      .mover-pct.dn { color: var(--red); }
      .mover-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); flex: 1; }
      .tier-badge {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 3px;
        letter-spacing: 0.05em;
      }
      .tier-badge.STRONG { background: var(--tier-pos-strong); color: var(--green); }
      .tier-badge.NORMAL { background: var(--tier-pos-normal); color: var(--green); }
      .tier-badge.WEAK   { background: var(--tier-pos-weak);   color: var(--text-secondary); }
      .mover-row.dn .tier-badge.STRONG { background: var(--tier-neg-strong); color: var(--red); }
      .mover-row.dn .tier-badge.NORMAL { background: var(--tier-neg-normal); color: var(--red); }
      .mover-row.dn .tier-badge.WEAK   { background: var(--tier-neg-weak);   color: var(--text-muted); }

      .fade-hint {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 600;
        padding: 2px 5px;
        border-radius: 3px;
        border: 1px solid var(--border-muted);
        color: var(--text-muted);
      }
      .fade-hint.long  { color: var(--green); border-color: var(--green-line); }
      .fade-hint.short { color: var(--red);   border-color: var(--red-line); }

      /* ── Empty / error states ─────────────────────────────── */
      .empty-state {
        text-align: center;
        padding: 24px 14px;
        color: var(--text-faint);
        font-family: var(--font-mono);
        font-size: 12px;
      }

      /* ── Last updated strip ───────────────────────────────── */
      .updated-strip {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-faint);
        padding: 6px 14px;
        border-top: 1px solid var(--hairline);
      }
    </style>
  </head>
  <body>
    <div class="edge-wrap">
      <!-- Header -->
      <div class="edge-header">
        <span class="edge-title">HL Edge</span>
        <div class="edge-header-right">
          <span class="refresh-badge" id="countdown">—</span>
          <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀</button>
        </div>
      </div>

      <!-- Macro -->
      <div class="edge-card" id="macro-card">
        <div class="card-label">Macro 4h</div>
        <div class="macro-row" id="macro-row">
          <span class="empty-state" style="padding:12px 0">loading…</span>
        </div>
      </div>

      <!-- Top Setups -->
      <div class="edge-card">
        <div class="card-label">Top Setups</div>
        <table class="setup-table">
          <thead>
            <tr>
              <th>Coin</th>
              <th>Score</th>
              <th>Funding</th>
              <th>Signals</th>
            </tr>
          </thead>
          <tbody id="setup-tbody">
            <tr><td colspan="4" class="empty-state">loading…</td></tr>
          </tbody>
        </table>
        <div class="updated-strip" id="setup-updated"></div>
      </div>

      <!-- Hot Movers -->
      <div class="edge-card">
        <div class="card-label">Hot Movers</div>
        <div class="movers-list" id="movers-list">
          <div class="empty-state">loading…</div>
        </div>
        <div class="updated-strip" id="movers-updated"></div>
      </div>
    </div>

    <script>
      // ── Theme ──────────────────────────────────────────────────────────
      function toggleTheme() {
        const cur = document.documentElement.getAttribute("data-theme");
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("hl-scanner-theme", next);
        document.getElementById("theme-btn").textContent = next === "dark" ? "☀" : "🌙";
      }
      (function () {
        const t = document.documentElement.getAttribute("data-theme");
        document.getElementById("theme-btn").textContent = t === "dark" ? "☀" : "🌙";
      })();

      // ── Helpers ────────────────────────────────────────────────────────
      function fmtPct(v, digits = 1) {
        if (v == null || !isFinite(v)) return "—";
        const sign = v >= 0 ? "+" : "";
        return `${sign}${v.toFixed(digits)}%`;
      }

      function fmtAPY(apy) {
        if (apy == null || !isFinite(apy)) return "—";
        const abs = Math.abs(apy);
        if (abs >= 1000) return `${(apy / 1000).toFixed(1)}k%`;
        return `${apy > 0 ? "+" : ""}${apy.toFixed(0)}%`;
      }

      function fmtAgo(ts) {
        if (!ts) return "";
        const s = Math.round((Date.now() - ts) / 1000);
        if (s < 60) return `${s}s ago`;
        if (s < 3600) return `${Math.round(s / 60)}m ago`;
        return `${Math.round(s / 3600)}h ago`;
      }

      // ── Macro ──────────────────────────────────────────────────────────
      let macroState = { btc: null, eth: null };

      async function fetchMacro() {
        const [btcCandles, ethCandles] = await Promise.all([
          fetch("/api/candles?coin=BTC&interval=4h").then(r => r.json()).catch(() => []),
          fetch("/api/candles?coin=ETH&interval=4h").then(r => r.json()).catch(() => []),
        ]);

        function last4hPct(candles) {
          if (!Array.isArray(candles) || candles.length < 2) return null;
          const last = candles[candles.length - 1];
          const prev = candles[candles.length - 2];
          const o = Number(prev.c ?? prev.close ?? prev.o);
          const c = Number(last.c ?? last.close);
          if (!o || !c) return null;
          return (c - o) / o * 100;
        }

        macroState.btc = last4hPct(btcCandles);
        macroState.eth = last4hPct(ethCandles);
        renderMacro();
      }

      function renderMacro() {
        const { btc, eth } = macroState;
        const row = document.getElementById("macro-row");

        function coinHtml(name, pct) {
          const cls = pct == null ? "flat" : pct > 0.3 ? "up" : pct < -0.3 ? "dn" : "flat";
          const arrow = pct == null ? "" : pct > 0 ? "▲" : pct < 0 ? "▼" : "●";
          return `
            <div class="macro-coin">
              <span class="macro-name">${name}</span>
              <span class="macro-pct ${cls}">${arrow} ${pct != null ? fmtPct(pct) : "—"}</span>
              <span class="macro-label">4h</span>
            </div>`;
        }

        // Verdict
        const both = btc != null && eth != null;
        const avgPct = both ? (btc + eth) / 2 : (btc ?? eth ?? null);
        let verdict = "";
        let macroDir = "neutral";
        if (avgPct != null) {
          if (avgPct < -1.0) { verdict = "BEAR"; macroDir = "bear"; }
          else if (avgPct > 1.0) { verdict = "BULL"; macroDir = "bull"; }
          else if (avgPct < -0.3) { verdict = "WEAK"; macroDir = "bear"; }
          else if (avgPct > 0.3) { verdict = "OK"; macroDir = "bull"; }
          else { verdict = "FLAT"; macroDir = "neutral"; }
        }

        // Store globally so setup table can use it
        window._macroDir = macroDir;

        row.innerHTML = `
          ${coinHtml("BTC", btc)}
          ${coinHtml("ETH", eth)}
          ${verdict ? `<span class="macro-verdict ${macroDir === "neutral" ? "mixed" : macroDir}">${verdict}</span>` : ""}
        `;
      }

      // ── Setup Scanner ──────────────────────────────────────────────────
      function scoreRow(r) {
        let score = 0;
        const active = [];

        // 1. Funding persist (48h window ready + extreme fraction)
        const fp = r.fundingPersist;
        const fundingExtreme = Math.abs(r.fundingApy || 0) > 50;
        const fundingPersistReady = fp && fp.fractionExtreme != null && fp.fractionExtreme > 0.4;
        if (fundingExtreme && fundingPersistReady) { score++; active.push("fund"); }
        else if (fundingExtreme && !fundingPersistReady) active.push("_fund"); // warming

        // 2. OI ramp without price move (7d ready)
        const oi = r.oi7d;
        const oiReady = oi && oi.deltaOi != null && oi.deltaPx != null;
        if (oiReady && oi.deltaOi > 0.5 && Math.abs(oi.deltaPx) < 0.07) { score++; active.push("OI↑"); }
        else if (oiReady && oi.deltaOi > 0.3) active.push("_oi");

        // 3. Basis (perp vs oracle)
        const premPct = (r.premium ?? 0) * 100;
        if (Math.abs(premPct) > 0.1) { score++; active.push("basis"); }

        // 4. Vol regime (30d ready)
        const vr = r.volRegime;
        if (vr && vr.ratio != null && vr.ratio > 1.5) { score++; active.push("vol"); }
        else if (vr && vr.ratio != null && vr.ratio > 1.2) active.push("_vol");

        // Direction: negative funding = shorts crowded = potential LONG
        const dir = (r.fundingApy || 0) < 0 ? "LONG" : "SHORT";
        return { score, active, dir };
      }

      async function fetchSetups() {
        const payload = await fetch("/api/setup-scanner").then(r => r.json()).catch(() => null);
        const tbody = document.getElementById("setup-tbody");
        const updEl = document.getElementById("setup-updated");
        if (!payload || !Array.isArray(payload.rows)) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty-state">no data</td></tr>';
          return;
        }

        const rows = payload.rows.map(r => ({ ...r, _s: scoreRow(r) }));
        rows.sort((a, b) => b._s.score - a._s.score || Math.abs(b.fundingApy || 0) - Math.abs(a.fundingApy || 0));

        const top = rows.filter(r => r._s.score >= 1).slice(0, 12);
        if (!top.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty-state">no scored setups yet</td></tr>';
          return;
        }

        const macroDir = window._macroDir ?? "neutral";

        tbody.innerHTML = top.map(r => {
          const { score, active, dir } = r._s;
          const isConflict = macroDir === "bear" && dir === "LONG" || macroDir === "bull" && dir === "SHORT";

          const dotClass = score >= 4 ? "score4" : score >= 3 ? "score3" : "score2";
          const dots = [0,1,2,3].map(i => `<span class="dot ${i < score ? "filled " + dotClass : ""}"></span>`).join("");

          const fundApy = r.fundingApy;
          const fundCls = fundApy == null ? "" : fundApy < -50 ? "extreme-neg" : fundApy > 50 ? "extreme-pos" : "normal";

          const sigHtml = ["fund","OI↑","basis","vol"].map(tag => {
            const on = active.includes(tag);
            return `<span class="sig-tag ${on ? "active" : ""}">${tag}</span>`;
          }).join("");

          return `<tr class="${isConflict ? "conflict-row" : ""}">
            <td>
              <div class="coin-cell">
                <span class="coin-name">${r.coin}</span>
                <span class="dir-badge ${dir === "LONG" ? "long" : "short"}">${dir}</span>
                ${isConflict ? '<i class="conflict-icon" title="Trend conflict">⚠</i>' : ""}
              </div>
            </td>
            <td><div class="score-dots">${dots}<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-left:4px">${score}/4</span></div></td>
            <td class="funding-cell ${fundCls}">${fmtAPY(fundApy)}</td>
            <td><div class="signal-tags">${sigHtml}</div></td>
          </tr>`;
        }).join("");

        if (payload.ts) updEl.textContent = `updated ${fmtAgo(payload.ts)}`;
      }

      // ── Hot Movers ─────────────────────────────────────────────────────
      async function fetchMovers() {
        const payload = await fetch("/api/signals?limit=20").then(r => r.json()).catch(() => null);
        const listEl = document.getElementById("movers-list");
        const updEl = document.getElementById("movers-updated");
        if (!payload || !Array.isArray(payload)) {
          listEl.innerHTML = '<div class="empty-state">no data</div>';
          return;
        }

        const movers = payload
          .filter(m => m.best && m.best.tier && m.best.tier !== "NEUTRAL" && m.best.spikePct != null)
          .slice(0, 10);

        if (!movers.length) {
          listEl.innerHTML = '<div class="empty-state">no active signals</div>';
          return;
        }

        listEl.innerHTML = movers.map(m => {
          const pct = m.best.spikePct;
          const isUp = pct >= 0;
          const tier = m.best.tier;
          // pump → hunter fades SHORT (sell the rip), dump → hunter fades LONG (buy the dip)
          const fadeSide = isUp ? "SHORT" : "LONG";
          const fadeCls = fadeSide === "LONG" ? "long" : "short";
          return `
            <div class="mover-row ${isUp ? "up" : "dn"}">
              <span class="mover-coin">${m.coin}</span>
              <span class="mover-pct ${isUp ? "up" : "dn"}">${fmtPct(pct)}</span>
              <span class="mover-meta">${m.best.label ?? ""}</span>
              <span class="tier-badge ${tier}">${tier}</span>
              <span class="fade-hint ${fadeCls}">fade ${fadeSide}</span>
            </div>`;
        }).join("");

        updEl.textContent = `updated ${fmtAgo(Date.now())}`;
      }

      // ── Refresh loop ───────────────────────────────────────────────────
      const REFRESH_S = 60;
      let secondsLeft = 0;
      let refreshTimer = null;

      async function refreshAll() {
        await Promise.all([fetchMacro(), fetchSetups(), fetchMovers()]);
      }

      function startCountdown() {
        secondsLeft = REFRESH_S;
        clearInterval(refreshTimer);
        refreshTimer = setInterval(() => {
          secondsLeft--;
          const el = document.getElementById("countdown");
          if (el) el.textContent = `↻ ${secondsLeft}s`;
          if (secondsLeft <= 0) {
            clearInterval(refreshTimer);
            refreshAll().then(startCountdown);
          }
        }, 1000);
      }

      refreshAll().then(startCountdown);
    </script>
  </body>
</html>
