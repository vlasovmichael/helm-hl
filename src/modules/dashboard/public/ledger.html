<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
    <title>Ledger · HL Scanner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hl-scanner-theme") || "auto";
          var theme =
            stored === "auto"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored === "light"
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .ledger-wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 20px 80px;
      }
      .ledger-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .ledger-head h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 4px;
        color: var(--text-primary);
      }
      .ledger-head .sub {
        font-size: 12.5px;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }
      .back-link {
        font-size: 13px;
        color: var(--text-secondary);
        text-decoration: none;
        padding: 7px 13px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition: all 0.15s var(--ease);
        white-space: nowrap;
      }
      .back-link:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
        border-color: var(--border-strong);
      }

      /* summary cards */
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 26px;
      }
      .stat-card {
        background: var(--card-bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 14px 16px;
      }
      .stat-card .k {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      .stat-card .v {
        font-family: var(--font-mono);
        font-size: 21px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: -0.01em;
      }
      .stat-card .vsub {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--text-muted);
        margin-top: 3px;
      }

      /* table */
      .table-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      table.ledger {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.ledger th,
      table.ledger td {
        padding: 11px 14px;
        text-align: right;
        white-space: nowrap;
      }
      table.ledger th:first-child,
      table.ledger td:first-child {
        text-align: left;
      }
      table.ledger thead th {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        font-weight: 600;
        background: var(--canvas-subtle);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
      }
      table.ledger thead th.grp {
        border-left: 1px solid var(--hairline);
        color: var(--text-secondary);
      }
      table.ledger tbody td {
        font-family: var(--font-mono);
        border-bottom: 1px solid var(--hairline);
        color: var(--text-secondary);
      }
      table.ledger tbody td.month {
        font-family: var(--font-sans);
        font-weight: 600;
        color: var(--text-primary);
      }
      table.ledger tbody tr:hover td {
        background: var(--card-bg-hover);
      }
      table.ledger tbody tr.current td.month::after {
        content: "live";
        font-family: var(--font-mono);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-left: 7px;
        padding: 1px 5px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        vertical-align: middle;
      }
      td.grp-edge {
        border-left: 1px solid var(--hairline);
      }
      .pos {
        color: var(--green);
      }
      .neg {
        color: var(--red);
      }
      .dim {
        color: var(--text-faint);
      }
      .net-cell {
        font-weight: 700;
      }
      .sub-meta {
        font-size: 10.5px;
        color: var(--text-faint);
        display: block;
        margin-top: 2px;
      }
      tfoot td {
        font-family: var(--font-mono);
        font-weight: 700;
        background: var(--canvas-subtle);
        border-top: 2px solid var(--border);
        color: var(--text-primary);
        padding: 13px 14px;
      }
      tfoot td.month {
        font-family: var(--font-sans);
      }
      .footnote {
        margin-top: 18px;
        font-size: 12px;
        line-height: 1.6;
        color: var(--text-muted);
      }
      .footnote b {
        color: var(--text-secondary);
      }
      .loading,
      .errbox {
        padding: 40px;
        text-align: center;
        color: var(--text-muted);
        font-family: var(--font-mono);
        font-size: 13px;
      }
      @media (max-width: 720px) {
        .col-opt {
          display: none;
        }
        .ledger-wrap {
          padding: 18px 12px 60px;
        }
      }
    </style>
  </head>
  <body>
    <div class="ledger-wrap">
      <div class="ledger-head">
        <div>
          <h1>Monthly Ledger</h1>
          <div class="sub">
            Source: Hyperliquid on-chain fills · since
            <span id="start-date">…</span>
          </div>
        </div>
        <a class="back-link" href="/">← Dashboard</a>
      </div>

      <div class="summary-grid" id="summary"></div>

      <div class="table-card">
        <div id="table-host">
          <div class="loading">Loading fills from Hyperliquid…</div>
        </div>
      </div>

      <div class="footnote" id="footnote"></div>
    </div>

    <script>
      const fmt = (n, sign = true) => {
        if (n == null || isNaN(n)) return "—";
        const s = (n < 0 ? "-" : sign && n > 0 ? "+" : "") + "$" + Math.abs(n).toFixed(2);
        return s;
      };
      const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "dim");
      const monthLabel = (k) => {
        const [y, m] = k.split("-");
        const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return names[parseInt(m, 10) - 1] + " " + y;
      };

      function renderSummary(t) {
        const cards = [
          { k: "Net P&L · all time", v: fmt(t.net), c: cls(t.net), sub: "after fees + funding" },
          { k: "Bot net", v: fmt(t.botNet), c: cls(t.botNet), sub: `${t.botCount} trades · ${t.botWinRate}% win` },
          { k: "Manual net", v: fmt(t.manualNet), c: cls(t.manualNet), sub: `${t.manualCount} trades · ${t.manualWinRate}% win` },
          { k: "Fees paid", v: fmt(-t.fees, false), c: "neg", sub: "total maker+taker" },
          { k: "Funding", v: fmt(t.funding), c: cls(t.funding), sub: "carry accrual" },
        ];
        document.getElementById("summary").innerHTML = cards
          .map(
            (c) => `
            <div class="stat-card">
              <div class="k">${c.k}</div>
              <div class="v ${c.c}">${c.v}</div>
              <div class="vsub">${c.sub}</div>
            </div>`,
          )
          .join("");
      }

      function row(m) {
        const wr = (w, c) => (c ? `<span class="sub-meta">${w}/${c} · ${Math.round((100 * w) / c)}%</span>` : "");
        return `
          <tr class="${m.isCurrent ? "current" : ""}">
            <td class="month">${monthLabel(m.month)}</td>
            <td class="grp-edge ${cls(m.botNet)}">${fmt(m.botNet)}${wr(m.botWins, m.botCount)}</td>
            <td class="col-opt dim">${m.botCount || "—"}</td>
            <td class="grp-edge ${cls(m.manualNet)}">${fmt(m.manualNet)}${wr(m.manualWins, m.manualCount)}</td>
            <td class="col-opt dim">${m.manualCount || "—"}</td>
            <td class="grp-edge neg">${m.botFees + m.manualFees ? fmt(-(m.botFees + m.manualFees), false) : "—"}</td>
            <td class="col-opt ${cls(m.funding)}">${m.funding ? fmt(m.funding) : "—"}</td>
            <td class="grp-edge net-cell ${cls(m.net)}">${fmt(m.net)}</td>
            <td class="${cls(m.cumulativeNet)}">${fmt(m.cumulativeNet)}</td>
          </tr>`;
      }

      function renderTable(data) {
        const t = data.totals;
        const head = `
          <table class="ledger">
            <thead>
              <tr>
                <th>Month</th>
                <th class="grp">Bot P&L</th>
                <th class="col-opt">#</th>
                <th class="grp">Manual P&L</th>
                <th class="col-opt">#</th>
                <th class="grp">Fees</th>
                <th class="col-opt">Funding</th>
                <th class="grp">Net</th>
                <th>Cumulative</th>
              </tr>
            </thead>
            <tbody>
              ${data.months.map(row).join("")}
            </tbody>
            <tfoot>
              <tr>
                <td class="month">Total</td>
                <td class="grp-edge ${cls(t.botNet)}">${fmt(t.botNet)}</td>
                <td class="col-opt dim">${t.botCount}</td>
                <td class="grp-edge ${cls(t.manualNet)}">${fmt(t.manualNet)}</td>
                <td class="col-opt dim">${t.manualCount}</td>
                <td class="grp-edge neg">${fmt(-t.fees, false)}</td>
                <td class="col-opt ${cls(t.funding)}">${fmt(t.funding)}</td>
                <td class="grp-edge net-cell ${cls(t.net)}">${fmt(t.net)}</td>
                <td class="${cls(t.net)}">${fmt(t.net)}</td>
              </tr>
            </tfoot>
          </table>`;
        document.getElementById("table-host").innerHTML = head;
      }

      function renderFootnote(data) {
        const t = data.totals;
        const gross = t.botNet + t.manualNet + t.fees; // net + fees = gross price pnl (+funding rolled in net)
        document.getElementById("footnote").innerHTML = `
          <b>Bot</b> = заявки бота (carry / hunter / chill boy). <b>Manual</b> = ручные сделки через UI.
          Net = price&nbsp;P&L − комиссии + funding. Прошлые месяцы заморожены в снапшоте, текущий считается вживую из fills.
          <br/>Комиссий уплачено за период: <b>${fmt(t.fees, false)}</b> — это ключевая статья на малом депозите.`;
      }

      async function load() {
        try {
          const r = await fetch("/api/ledger");
          if (!r.ok) throw new Error("HTTP " + r.status);
          const data = await r.json();
          document.getElementById("start-date").textContent = data.startDate || "—";
          if (!data.live || !data.months.length) {
            document.getElementById("table-host").innerHTML =
              '<div class="errbox">Нет данных (бот в PAPER-режиме или fills недоступны).</div>';
            return;
          }
          renderSummary(data.totals);
          renderTable(data);
          renderFootnote(data);
        } catch (e) {
          document.getElementById("table-host").innerHTML =
            '<div class="errbox">Ошибка загрузки: ' + e.message + "</div>";
        }
      }
      load();
    </script>
  </body>
</html>
