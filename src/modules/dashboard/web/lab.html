<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0c0a09"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f1ea"
      media="(prefers-color-scheme: light)"
    />
    <title>Helm · Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hl-scanner-theme") || "auto";
          var theme;
          if (stored === "auto") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            theme = stored === "light" ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="container">
      <nav class="topnav" id="topnav" aria-label="Primary"></nav>

      <header>
        <div class="equity-group">
          <div class="label">Lab</div>
          <div class="value" style="font-size: 20px">Research · Strategies &amp; Verdicts</div>
        </div>
        <div class="meta-group">
          <div id="ws-pill" class="status-pill offline">WS connecting…</div>
        </div>
      </header>

      <!-- 01 / Strategies — единый обзор всех стратегий (реестр-driven). Перенесено
           со statistics, первой картой на Lab. Данные — из WS status-payload
           (msg.data.strategies), renderStrategies() в lab.js. Live/Paper/Radar. -->
      <section class="card" id="sec-strategies">
        <div class="card-header">
          <div
            class="card-title"
            data-num=""
            title="Все стратегии в одном месте. Live торгует реальными деньгами, Paper копит статистику в shadow-слоте (отдельно от прода), Radar только сигналит, Planned — зарезервированное место под будущие стратегии."
          >
            Strategies
          </div>
          <div class="time-ranges" id="strategies-summary"></div>
        </div>
        <div class="strat-table-wrap">
          <table class="strat-table" id="strategies-table">
            <thead>
              <tr>
                <th class="strat-col-name">Strategy</th>
                <th title="Режим работы">Status</th>
                <th title="Открытая позиция (slot / paper-slot)">Position</th>
                <th class="num" title="Виртуальный equity compound-песочницы (paper)">Equity</th>
                <th class="num" title="Число закрытых сделок">Trades</th>
                <th class="num" title="Доля прибыльных">Win%</th>
                <th class="num" title="Ожидание на сделку (avg net)">Exp</th>
                <th class="num" title="Payoff = avgWin / |avgLoss|. ≥2 = здоровый профиль">Payoff</th>
                <th class="num" title="Макс. просадка по кривой net-P&L">Max DD</th>
                <th class="num" title="Net P&L сегодня">Today</th>
                <th class="num" title="Net P&L за 7 дней">7d</th>
                <th class="num" title="Net P&L за всё время">All</th>
                <th class="strat-col-spark" title="Кривая накопленного P&L">Trend</th>
              </tr>
            </thead>
            <tbody id="strategies-tbody">
              <tr class="strat-skel-row"><td colspan="13"><div class="skeleton-row" style="width:70%"></div></td></tr>
              <tr class="strat-skel-row"><td colspan="13"><div class="skeleton-row" style="width:85%"></div></td></tr>
              <tr class="strat-skel-row"><td colspan="13"><div class="skeleton-row" style="width:60%"></div></td></tr>
              <tr class="strat-skel-row"><td colspan="13"><div class="skeleton-row" style="width:78%"></div></td></tr>
              <tr class="strat-skel-row"><td colspan="13"><div class="skeleton-row" style="width:66%"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Сняты 2026-08-11: Spike-Fade (01.5), BTC Divergence (02), Whale Watch
           (02.5). Spike-Fade показывал замёрзший снимок — mid-based замер снят
           21.07, наследник liq-wick пишет в data/liq-wick/. Divergence и Whale
           Watch не использовались и никогда не валидировались: карточка, на
           которую смотришь и не действуешь, — налог на внимание. Код фич цел
           (web/src/features/), вернуть = импорт + разметка. -->

      <!-- 01.8 / Гении Уолл-стрит (бывш. «А если взять троих») — предзаявленный
           форвардный тест. Название шуточное, суть прежняя: три адреса с вершины
           лидерборда, замороженные 13.08.2026, против контрольной группы.
           Правила в docs/winners-preregistration.md, решение 10.11.2026. -->
      <section class="card" id="sec-winners">
        <div class="card-header">
          <div
            class="card-title"
            data-num="01.8"
            title="Вопрос: медианы по децилям ничего не говорят о трёх лучших адресах внутри дециля. Здесь список из трёх заморожен ЗАРАНЕЕ (13.08.2026) и проверяется вперёд против контрольной группы, прошедшей те же фильтры. Ключевой фильтр — оборот ≥ 5 размеров счёта: без него отбор выдаёт держателей лонга, у которых PnL это нереализованная прибыль, а не торговля."
          >
            Гении Уолл-стрит
          </div>
          <span
            id="win-meta"
            style="
              font-size: 11px;
              font-family: var(--font-mono);
              color: var(--text-muted);
            "
          ></span>
        </div>
        <div class="u-scroll-x">
          <table class="data-table" id="win-table">
            <thead>
              <tr>
                <th title="Адрес на Hyperliquid: ▸ разворачивает его открытые позиции прямо сейчас (монета, сторона, плечо, плавающий PnL), сама ссылка ведёт в explorer. Позиции — наблюдение, вердикт теста они не меняют.">Адрес</th>
                <th class="r" title="Эдж, по которому адрес был отобран: прибыль на доллар оборота за месяц до заморозки">Отбор, бп</th>
                <th class="r" title="Эдж ПОСЛЕ заморозки — то единственное, что здесь что-то значит">Форвард, бп</th>
                <th class="r" title="Прибыль после заморозки">PnL</th>
                <th class="r" title="Оборот после заморозки">Оборот</th>
              </tr>
            </thead>
            <tbody id="win-tbody">
              <tr><td colspan="5" class="empty-state">…</td></tr>
            </tbody>
          </table>
        </div>
        <div
          id="win-stats"
          style="
            margin-top: 8px;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            line-height: 1.6;
          "
        ></div>
      </section>

      <!-- 01.9 / Форвард FVG — предзаявлен 28.08.2026, оценка при n=1500.
           Карточка показывает ТОЛЬКО счётчик и возраст последней записи: ни
           E[R], ни winrate. Это не скупость вывода, а условие теста — stopRule
           запрещает промежуточные замеры, а увиденное число невозможно развидеть.
           Данные: scripts/fvgForward.mjs → data/fvg-forward/trades.jsonl. -->
      <section class="card" id="sec-fvg">
        <div class="card-header">
          <div
            class="card-title"
            data-num="01.9"
            title="Ретест широкой FVG-зоны (>1.6%) на 4h по тренду ТФ. На бэктесте 28.04–28.08.2026 дал E[R]=+0.174 при кластерном CI [0.060, 0.292] и держался во всех четырёх клетках лонг/шорт × btc_up/btc_down — то есть не сводился к бете. Но порог 1.6% выбран на тех же данных, поэтому проверять его можно только на свежих. Здесь копится именно это: сделки со входом после 29.08.2026."
          >
            Форвард FVG
          </div>
          <span
            id="fvg-meta"
            style="
              font-size: 11px;
              font-family: var(--font-mono);
              color: var(--text-muted);
            "
          ></span>
        </div>
        <div id="fvg-body" style="font-family: var(--font-mono); font-size: 12px">
          <div class="empty-state">…</div>
        </div>
      </section>

      <footer id="footer-status">
        <span>Connecting to core…</span>
        <a
          href="/logout"
          class="logout-link"
          id="logout-link"
          style="display: none"
          >Sign out</a
        >
      </footer>
    </div>

    <script type="module" src="/lab.js"></script>
  </body>
</html>
