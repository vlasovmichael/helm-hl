<!doctype html>
<html lang="en">
  <head>
    <!--#head-->
    <title>Helm · Lab</title>
  </head>
  <body>
    <div class="container">
      <nav class="topnav" id="topnav" aria-label="Primary"></nav>

      <header id="page-header"></header>

      <!-- 01 / Режимы ведения позиции (реестр-driven). Перенесено
           со statistics, первой картой на Lab. Данные — из WS status-payload
           (msg.data.strategies), renderStrategies() в lab.js. Live/Paper/Radar. -->
      <section class="card" id="sec-strategies">
        <div class="card-header">
          <div
            class="card-title"
            data-card="How positions are run, in one place. Live trades real money; Paper accumulates stats in a shadow slot, separate from production."
          >
            How positions are run
          </div>
          <div class="seg" id="strategies-summary"></div>
        </div>
        <div class="table-wrap strat-table-wrap">
          <table class="table table--compact table--sticky-head strat-table" id="strategies-table">
            <thead>
              <tr>
                <th class="strat-col-name">Strategy</th>
                <th data-card="Operating mode">Status</th>
                <th data-card="Open position (slot / paper slot)">Position</th>
                <th class="num" data-card="Virtual equity of the compounding paper sandbox">Equity</th>
                <th class="num" data-card="Number of closed trades">Trades</th>
                <th class="num" data-card="Share of winners">Win%</th>
                <th class="num" data-card="Expectancy per trade (avg net)">Exp</th>
                <th class="num" data-card="Payoff = avgWin / |avgLoss|. ≥2 is a healthy profile">Payoff</th>
                <th class="num" data-card="Max drawdown on the net P&L curve">Max DD</th>
                <th class="num" data-card="Net P&L today">Today</th>
                <th class="num" data-card="Net P&L over 7 days">7d</th>
                <th class="num" data-card="Net P&L all time">All</th>
                <th class="strat-col-spark" data-card="Cumulative P&L curve">Trend</th>
              </tr>
            </thead>
            <tbody id="strategies-tbody">
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Сняты 2026-08-11: Spike-Fade (01.5), BTC Divergence (02), Whale Watch
           (02.5). Spike-Fade показывал замёрзший снимок — mid-based замер снят
           21.07, наследник liq-wick пишет в data/liq-wick/. Divergence и Whale
           Watch не использовались и никогда не валидировались: карточка, на
           которую смотришь и не действуешь, — налог на внимание. Код фич цел
           (web/src/features/), вернуть = импорт + разметка. -->

      <!-- 01.8 / Wall Street geniuses (бывш. «А если взять троих») — предзаявленный
           форвардный тест. Название шуточное, суть прежняя: три адреса с вершины
           лидерборда, замороженные 13.08.2026, против контрольной группы.
           Правила в docs/winners-preregistration.md, решение 10.11.2026. -->
      <section class="card" id="sec-winners">
        <div class="card-header">
          <div
            class="card-title"
            data-card="Question: decile medians say nothing about the three best addresses inside a decile. Here the list of three was frozen IN ADVANCE (2026-08-13) and is checked forward."
          >
            Wall Street geniuses
          </div>
          <span
            id="win-meta"
            style="
              font-size: var(--fs-label);
              font-family: var(--font-mono);
              color: var(--text-muted);
            "
          ></span>
        </div>
        <div class="u-scroll-x">
          <table class="table table--sticky-head signals-table" id="win-table">
            <thead>
              <tr>
                <th data-card="Hyperliquid address: the arrow expands its open positions right now (coin, side, leverage, floating PnL); the link itself opens the explorer">Address</th>
                <th class="num" data-card="Edge the address was selected on: profit per dollar of turnover in the month before the freeze">Selection, bp</th>
                <th class="num" data-card="Edge AFTER the freeze — the only number here that means anything">Forward, bp</th>
                <th class="num" data-card="Profit after the freeze">PnL</th>
                <th class="num" data-card="Turnover after the freeze">Turnover</th>
              </tr>
            </thead>
            <tbody id="win-tbody">
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
            </tbody>
          </table>
        </div>
        <div
          id="win-stats"
          style="
            margin-top: 8px;
            font-size: var(--fs-label);
            font-family: var(--font-mono);
            color: var(--text-muted);
            line-height: 1.6;
          "
        ></div>
        <!-- Лента событий: пуш от winnersWatch холодный и живёт сутки, а
             таблица выше показывает только открытое сейчас. Здесь закрытая
             позиция остаётся вместе с исходом. -->
        <div class="win-log-block">
          <div id="win-log-head">
            <span>What they did (last 7 days)</span>
            <span id="win-log-sum"></span>
          </div>
          <div class="win-log-scroll">
            <table class="table table--compact table--sticky-head" id="win-log-table">
              <thead>
                <tr>
                  <th data-card="How long ago the event happened">Age</th>
                  <th data-card="OPEN — position opened; CLOSE — closed; FLIP — closed and reopened on the other side">Event</th>
                  <th data-card="Coin, side, leverage and notional at the moment of the event">Position</th>
                  <th class="num" data-card="How long the position was held before it closed">Held</th>
                  <th class="num" data-card="Realised result net of fees; an open position has no result yet">Net</th>
                  <th data-card="Which of the three frozen addresses did it">Address</th>
                </tr>
              </thead>
              <tbody id="win-log">
                <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
                <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
                <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 01.9 / FVG forward test — предзаявлен 28.08.2026, оценка при n=1500.
           Карточка показывает ТОЛЬКО счётчик и возраст последней записи: ни
           E[R], ни winrate. Это не скупость вывода, а условие теста — stopRule
           запрещает промежуточные замеры, а увиденное число невозможно развидеть.
           Данные: scripts/fvgForward.mjs → data/fvg-forward/trades.jsonl. -->
      <section class="card" id="sec-fvg">
        <div class="card-header">
          <div
            class="card-title"
            data-card="Preregistered forward tests. Each one is evaluated exactly once, when its own stop rule is met. No interim metrics are shown — that is the point."
          >
            Forward tests
          </div>
          <span
            id="fvg-meta"
            style="
              font-size: var(--fs-label);
              font-family: var(--font-mono);
              color: var(--text-muted);
            "
          ></span>
        </div>
        <div id="fvg-body" style="font-family: var(--font-mono); font-size: var(--fs-small)">
          <div class="sk-text">
            <span class="sk sk-line"></span>
            <span class="sk sk-line"></span>
            <span class="sk sk-line"></span>
          </div>
        </div>
      </section>

      <footer id="footer-status">
        <span>Connecting to core…</span>
        <a
          href="/logout"
          class="logout-link"
          id="logout-link"
          style="display: none"
          >Sign out</a
        >
      </footer>
    </div>

    <script type="module" src="/lab.js"></script>
  </body>
</html>
