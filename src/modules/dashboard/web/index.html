<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0c0a09"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f1ea"
      media="(prefers-color-scheme: light)"
    />
    <title>Helm</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hl-scanner-theme") || "auto";
          var theme;
          if (stored === "auto") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            theme = stored === "light" ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="container">
      <nav class="topnav" id="topnav" aria-label="Primary"></nav>

      <header data-edition="">
        <div class="equity-group">
          <div class="label">Total Equity</div>
          <div class="value animated-value" id="equity-value">$0.00</div>
          <div class="delta" id="equity-delta">—</div>
        </div>
        <div class="meta-group">
          <div id="ws-pill" class="status-pill offline">WS connecting…</div>
          <div class="meta-info">
            <span id="uptime-val">Uptime: —</span>
            <span id="available-val">Available: —</span>
            <span id="wallet-total-val" style="display: none"></span>
          </div>
        </div>
      </header>

      <!-- Day Desk — три вопроса дня: сколько уже сделал, сколько можно потерять,
           защищены ли позы. Стоит ВЫШЕ позиций и сетапов намеренно: по разбору
           журнала минус делают дни с несколькими входами, а не отдельные сделки,
           поэтому первым на экране должен быть бюджет дня, а не идея. -->
      <section class="card daydesk" id="sec-day">
        <div class="card-header">
          <div class="card-title" data-num="00">Today</div>
          <div class="oi-toolbar">
            <span class="oi-span" id="day-meta"></span>
          </div>
        </div>
        <div id="day-desk" class="dd-grid">
          <div class="dd-empty">Loading…</div>
        </div>
        <div id="day-rules" class="dd-rules"></div>
      </section>

      <!-- Market Context — живая статистика по BTC (цена по биржевому WS);
           цвет рамки = фон (risk-on/off). Стоит вплотную НАД позициями: фон
           рынка читается в одном движении глаза с тем, что открыто, а бюджет
           дня (Today) остаётся первым на экране. -->
      <div
        id="market-context"
        class="market-context unknown mc-loading"
        title="Live BTC stats. Green frame = clear trend (RISK-ON/OFF), trade with the backdrop. Yellow = range, trading against structure is risky."
      >
        <span class="mc-loader" aria-hidden="true"><span class="loader-spinner"></span></span>
        <span class="mc-head" id="mc-head"></span>
        <span class="mc-stats" id="mc-stats"></span>
      </div>

      <!-- 01 / Active Position -->
      <section class="card" id="sec-position">
        <div class="card-header">
          <div class="card-title" data-num="01">Active Position</div>
          <div id="daily-goal-badge" class="daily-goal-badge" hidden></div>
        </div>
        <div id="position-container"></div>
        <div id="manual-positions-container"></div>
        <div id="mp-active-container"></div>

        <!-- Ручной вход/выход прямо с дашборда. Ордера уходят через SDK, поэтому
             builder-fee = 0 бп (сторонние фронтенды берут 2 бп) и кошелёк не
             всплывает. Стоп ставит нянька — модалка его только показывает.
             Стоит ПОД позициями намеренно: сначала смотришь, что уже открыто,
             и только потом открываешь ещё. -->
        <button
          id="tt-trade-btn"
          class="tt-trade-cta"
          type="button"
          title="Open or close a position. Orders go straight to Hyperliquid via the API wallet — no builder fee, no wallet popup. The bot still places the stop and runs the exit."
        >
          <svg
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 17l6-6 4 4 8-8" />
            <path d="M17 7h4v4" />
          </svg>
          Trade
        </button>
      </section>

      <!-- 01.4 / Screen — монеты, отобранные по цене входа, + бюджет дня.
           Заменяет Hot Movers в роли «куда смотреть»: отбор идёт по трению
           (спред + комиссии), а не по движению. Обоснование и порог —
           routes/screen.js. Предсказаний здесь нет и быть не должно. -->
      <section class="card" id="sec-screen">
        <div class="card-header">
          <div
            class="card-title"
            data-num="01.4"
            title="Coins where entering is cheap. «Friction» = what share of your risk budget the round trip (book spread + two taker fees) eats. These are NOT signals: the list is filtered by cost of entry, movement is shown as fact — the call is yours."
          >
            Screen
          </div>
          <div class="scr-header-right">
            <span id="screen-actions-slot"></span>
            <span id="screen-meta" class="scr-meta"></span>
          </div>
        </div>
        <div id="screen-budget" class="scr-budget"></div>
        <div class="u-scroll-x">
          <table class="data-table scr-table">
            <thead>
              <tr>
                <th data-sort="coin" title="Sort by ticker">Coin</th>
                <th class="r" data-sort="price" title="Sort by price">Price</th>
                <th
                  class="r"
                  data-sort="move"
                  title="Short-window move from the bot's live price buffer (15m, falls back to 1h). Sort by size of move."
                >
                  Move
                </th>
                <th class="r" data-sort="chg24h" title="Sort by 24h change">24h</th>
                <th
                  class="r"
                  data-sort="friction"
                  title="What share of your risk budget the round trip eats: book spread + two taker fees (4.32 bp each). Small print is the raw spread. Sort cheapest first."
                >
                  Friction
                </th>
                <th
                  class="r"
                  data-sort="mine"
                  title="Your own track record on this coin: net P&L, number of trades and winrate. Not a prediction about the market — a fact about you."
                >
                  Mine
                </th>
                <th class="r" data-sort="volume" title="Sort by 24h volume">Volume</th>
              </tr>
            </thead>
            <tbody id="screen-tbody">
              <tr>
                <td colspan="7" class="empty-state">Building screen…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- 01.5 / Hot Movers — live price spikes + OI delta -->
      <section class="card" id="sec-movers">
        <div class="card-header">
          <div
            class="card-title"
            data-num="01.5"
            title="Coins with the largest price moves. Setup is a context direction (dump → SHORT, pump → LONG) — NOT a trade: continuation backtests negative."
          >
            Hot Movers
          </div>
          <div class="hm-header-right">
            <span id="hm-actions-slot"></span>
            <span id="hm-tools" class="hm-tools">
            <button
              id="mp-paper-btn"
              class="whatif-btn"
              type="button"
              title="Open a paper trade (your own paper, Rabbit-style): coin, side, leverage, size off equity. The bot doesn't trade it — you run it by hand."
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="vertical-align: -2px; margin-right: 4px"
              >
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
              </svg>
              Paper
            </button>
            <button
              id="whatif-btn"
              class="whatif-btn"
              type="button"
              title="Itchy hands? Type a coin and side — the bot checks it against the fade-high-ER edge and either backs you or stops you"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="vertical-align: -2px; margin-right: 4px"
              >
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              What if…
            </button>
            </span>
            <span
              id="hot-movers-meta"
              style="
                font-size: 11px;
                font-family: var(--font-mono);
                color: var(--text-muted);
              "
            ></span>
          </div>
        </div>
        <button
          type="button"
          id="hm-toggle"
          class="hm-toggle"
          aria-expanded="false"
          aria-controls="hm-collapsible"
          title="The spike list across the whole exchange is the «twenty entries a day» technique — hidden by default. Paper and What if… stay available either way."
        >
          <span class="hm-toggle__label">Show Hot Movers table</span>
          <span class="hm-toggle__chev" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </span>
        </button>
        <div class="hm-collapsible" id="hm-collapsible">
        <div class="u-scroll-x hm-scroll-wrap">
          <table class="data-table signals-table hm-table">
            <thead>
              <tr>
                <th style="width: 24px">#</th>
                <th>Coin</th>
                <th
                  class="c"
                  title="Fade setup: SHORT/LONG = ready to fade the move; WAIT = waiting for momentum to exhaust"
                >
                  Setup
                </th>
                <th
                  class="c"
                  title="Chase meter: how far price has already run IN THE TRADE DIRECTION from the short average (15m, 5m fallback). Lit only on a confirmed setup. 🎯 near the base — no chase; ⏳ stretched — let it pull back; ⛔ already gone your way — too late, wait for a retrace. You pick the 5m entry yourself."
                >
                  Enter
                </th>
                <th class="r">Price</th>
                <th class="r">2m%</th>
                <th class="r">5m%</th>
                <th class="r">15m%</th>
                <th
                  class="r"
                  title="Acceleration: |2m| vs 5m extrapolation. ▼ = exhausting (fade), ▲ = accelerating (avoid)"
                >
                  Acc
                </th>
                <th
                  class="r"
                  title="OI change over 5 minutes. Rising = new positions; falling = closes/liquidations"
                >
                  OI 5m
                </th>
                <th class="r" title="15m trend">
                  Trend
                </th>
              </tr>
            </thead>
            <tbody id="hot-movers-tbody">
              <tr>
                <td colspan="11" class="empty-state">
                  Waiting for price history…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        </div>
      </section>

      <!-- Recent Activity — лента open/close (рендерит index.js через /api/activity).
           /api/activity = локальный эндпоинт (своя БД сделок, без вызовов HL) →
           веса Hyperliquid не тратит, к 429 отношения не имеет. -->
      <section class="card" id="sec-activity">
        <div class="card-header">
          <div class="card-title" data-num="">Recent Activity</div>
        </div>
        <div id="bans-strip"></div>
        <div id="activity-container">
          <div class="activity-skeleton">
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
            <div class="skeleton-row"></div>
          </div>
        </div>
      </section>


      <footer id="footer-status">
        <span>Connecting to core…</span>
        <a
          href="/logout"
          class="logout-link"
          id="logout-link"
          style="display: none"
          >Sign out</a
        >

    <!-- Mobile bottom navigation: scroll-spy across main sections -->
    <nav class="bottom-nav" aria-label="Sections">
      <button class="bottom-nav-btn" data-target="sec-day" aria-label="Today">
        <span class="nav-icon" aria-hidden="true"></span>
        <span>Today</span>
      </button>
      <button
        class="bottom-nav-btn active"
        data-target="sec-position"
        aria-label="Position"
      >
        <span class="nav-icon" aria-hidden="true"></span>
        <span>Pos</span>
      </button>
      <button class="bottom-nav-btn" data-target="sec-screen" aria-label="Screen">
        <span class="nav-icon" aria-hidden="true"></span>
        <span>Screen</span>
      </button>
      <button

        data-target="sec-movers"
        aria-label="Hot Movers"
      >
        <span class="nav-icon" aria-hidden="true"></span>

      <button
        class="bottom-nav-btn"
        data-target="sec-activity"
        aria-label="Recent Activity"

        <span>Log</span>

    <script>
      // ── Header edition stamp (date) ──
      (function () {
        try {
          var d = new Date();
          var ed = d.toISOString().slice(0, 10);
          var hdr = document.querySelector("header[data-edition]");
          if (hdr) hdr.setAttribute("data-edition", ed);
        } catch (_) {}
      })();

      // ── Mobile tape-bar mirror ──
      // Keeps the sticky equity bar in sync with the hero values without touching app.js.
      (function () {
        var heroValue = document.getElementById("equity-value");
        var heroDelta = document.getElementById("equity-delta");
        var modePill = document.getElementById("mode-pill");
        var tapeValue = document.getElementById("tape-equity");
        var tapeDelta = document.getElementById("tape-delta");
        var tapeMode = document.getElementById("tape-mode");
        if (!heroValue || !tapeValue) return;

        function sync() {
          if (heroValue && tapeValue)
            tapeValue.textContent = heroValue.textContent.trim();
          if (heroDelta && tapeDelta) {
            tapeDelta.textContent = heroDelta.textContent.trim();
            tapeDelta.className =
              "tape-delta " +
              (heroDelta.classList.contains("positive")
                ? "positive"
                : heroDelta.classList.contains("negative")
                  ? "negative"
                  : "");
          }
          if (modePill && tapeMode)
            tapeMode.textContent = modePill.textContent.trim();
        }

        var mo = new MutationObserver(sync);
        mo.observe(heroValue, {
          childList: true,
          characterData: true,
          subtree: true,
        });
        if (heroDelta)
          mo.observe(heroDelta, {
            childList: true,
            characterData: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["class"],
          });
        if (modePill)
          mo.observe(modePill, {
            childList: true,
            characterData: true,
            subtree: true,
          });
        sync();
      })();

      // ── Bottom-nav scroll-spy ──
      (function () {
        var nav = document.querySelector(".bottom-nav");
        if (!nav) return;
        var btns = Array.prototype.slice.call(
          nav.querySelectorAll("[data-target]"),
        );
        var sections = btns
          .map(function (b) {
            return document.getElementById(b.dataset.target);
          })
          .filter(Boolean);

        btns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var el = document.getElementById(btn.dataset.target);
            if (!el) return;
            var y = el.getBoundingClientRect().top + window.pageYOffset - 70;
            window.scrollTo({ top: y, behavior: "smooth" });
          });
        });

        if (!("IntersectionObserver" in window)) return;

        var observer = new IntersectionObserver(
          function (entries) {
            // Pick the entry closest to top of viewport that is currently intersecting.
            var visible = entries
              .filter(function (e) {
                return e.isIntersecting;
              })
              .sort(function (a, b) {
                return a.boundingClientRect.top - b.boundingClientRect.top;
              })[0];
            if (!visible) return;
            var id = visible.target.id;
            btns.forEach(function (b) {
              b.classList.toggle("active", b.dataset.target === id);
            });
          },
          { rootMargin: "-30% 0px -55% 0px", threshold: 0 },
        );

        sections.forEach(function (s) {
          observer.observe(s);
        });
      })();
    </script>

    <script>
      // ── Radar accordions: persist open/closed + collapsed-header badges ──
      (function () {
        var accs = Array.prototype.slice.call(
          document.querySelectorAll("details.radar-acc"),
        );
        if (!accs.length) return;
        var KEY = "hl-radar-acc";
        var state = {};
        try {
          state = JSON.parse(localStorage.getItem(KEY) || "{}");
        } catch (_) {}

        function updateBadge(d) {
          var badge = d.querySelector(":scope > summary .radar-badge");
          if (!badge) return;
          var rows = d.querySelectorAll("tbody tr");
          var real = 0,
            first = "";
          Array.prototype.forEach.call(rows, function (r) {
            if (r.querySelector(".empty-state")) return;
            real++;
            if (!first) {
              var pair = r.querySelector("td:nth-child(2)");
              if (pair) first = pair.textContent.trim();
            }
          });
          badge.textContent = real ? (first ? first + " · " : "") + real : "";
        }

        accs.forEach(function (d) {
          var id = d.dataset.acc || d.id;
          // По умолчанию свёрнуто (declutter); восстанавливаем сохранённое.
          if (state[id] === true) d.setAttribute("open", "");
          else d.removeAttribute("open");

          d.addEventListener("toggle", function () {
            state[id] = d.open;
            try {
              localStorage.setItem(KEY, JSON.stringify(state));
            } catch (_) {}
            if (!d.open) updateBadge(d);
          });

          // Клик по «?»-кнопке в шапке не должен сворачивать аккордеон.
          var help = d.querySelector("summary .help-btn");
          if (help)
            help.addEventListener("click", function (e) {
              e.stopPropagation();
            });
        });

        function refresh() {
          accs.forEach(function (d) {
            if (!d.open) updateBadge(d);
          });
        }
        setInterval(refresh, 3000);
        refresh();
      })();
    </script>

    <!-- Motion layer: reveal-on-scroll со стаггером. Только transform/opacity,
         IntersectionObserver (не на каждый кадр) → дёшево и стабильно 60fps.
         JS сам ставит data-reveal, поэтому без JS контент остаётся видимым. -->
    <script>
      (function () {
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var targets = [].slice.call(
          document.querySelectorAll("section.card, #market-context")
        );
        if (reduce || !("IntersectionObserver" in window) || !targets.length)
          return;

        targets.forEach(function (el) {
          el.setAttribute("data-reveal", "");
        });

        var vh = window.innerHeight || 800;
        var firstScreen = 0;
        var io = new IntersectionObserver(
          function (entries, obs) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              var el = entry.target;
              // Стаггерим только то, что уже в первом экране на старте;
              // карточки ниже всплывают по одной по мере доскролла.
              var rect = el.getBoundingClientRect();
              if (rect.top < vh) {
                el.style.setProperty("--reveal-i", firstScreen++);
              }
              el.classList.add("is-revealed");
              obs.unobserve(el);
              // Вход доигран → снимаем data-reveal совсем. Атрибут держит на
              // элементе transition по transform/opacity, а живой transition —
              // это повод для браузера не отпускать композиторный слой. Ровно
              // он и давал мигающую полоску на плашке BTC (см. _motion.scss).
              var drop = function () {
                el.removeAttribute("data-reveal");
                el.style.removeProperty("--reveal-i");
              };
              el.addEventListener("transitionend", drop, { once: true });
              // Страховка: если transitionend не придёт (вкладка в фоне —
              // таймлайн анимаций там стоит), чистим по таймеру.
              setTimeout(drop, 1500);
            });
          },
          { threshold: 0.08, rootMargin: "0px 0px -8% 0px" }
        );

        targets.forEach(function (el) {
          io.observe(el);
        });
      })();
    </script>

    <script type="module" src="/index.js"></script>
  </body>
