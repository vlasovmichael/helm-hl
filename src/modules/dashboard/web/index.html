<!doctype html>
<html lang="en">
  <head>
    <!--#head-->
    <title>Helm</title>
  </head>
  <body>
    <div class="container">
      <nav class="topnav" id="topnav" aria-label="Primary"></nav>

      <header data-edition="">
        <div class="equity-group">
          <div class="label">Total Equity</div>
          <!-- 🚨 Не «$0.00»: до первого кадра это НЕ ноль на счету, а
               отсутствие данных, и выглядели они одинаково. -->
          <div class="value animated-value" id="equity-value">
            <span class="sk sk-num sk-num--lg"></span>
          </div>
          <div class="delta" id="equity-delta"><span class="sk sk-chip"></span></div>
        </div>
        <div class="meta-group">
          <div class="pill-row">
            <div id="ws-pill" class="status-pill offline">WS connecting…</div>
            <!-- Плашка здоровья фидов. Пока состояние неизвестно — скелетон,
                 а не пустое место: дырка в шапке читалась как «всё хорошо». -->
            <div id="health-pill" class="status-pill is-loading">
              <span class="sk sk-chip"></span>
            </div>
          </div>
          <div class="meta-info">
            <span id="uptime-val">Uptime: —</span>
            <span id="available-val">Available: —</span>
            <span id="wallet-total-val" style="display: none"></span>
          </div>
        </div>
      </header>

      <!-- Market Context — живая статистика по BTC (цена по биржевому WS);
           цвет рамки = фон (risk-on/off). Стоит вплотную НАД позициями: фон
           рынка читается в одном движении глаза с тем, что открыто, а бюджет
           дня (Today) остаётся первым на экране. -->
      <div
        id="market-context"
        class="market-context unknown mc-loading"
        data-card="Live BTC stats. Green frame = clear trend (RISK-ON/OFF), trade with the backdrop. Yellow = range, trading against structure is risky."
      >
        <span class="mc-loader" aria-hidden="true"><span class="loader-spinner"></span></span>
        <span class="mc-head" id="mc-head"></span>
        <span class="mc-spark-wrap" id="mc-spark" data-card="BTC price, last 24h"></span>
        <span class="mc-stats" id="mc-stats"></span>
      </div>

      <!-- 01 / Active Position -->
      <section class="card" id="sec-position">
        <div class="card-header">
          <div class="card-title">Active Position</div>
          <div id="daily-goal-badge" class="daily-goal-badge" hidden></div>
        </div>
        <div id="position-container"></div>
        <div id="manual-positions-container"></div>
        <div id="mp-active-container"></div>

        <!-- Ручной вход/выход прямо с дашборда. Ордера уходят через SDK, поэтому
             builder-fee = 0 бп (сторонние фронтенды берут 2 бп) и кошелёк не
             всплывает. Стоп ставит нянька — модалка его только показывает.
             Стоит ПОД позициями намеренно: сначала смотришь, что уже открыто,
             и только потом открываешь ещё. -->
        <button
          id="tt-trade-btn"
          class="btn btn--primary btn--cta"
          type="button"
          data-card="Open or close a position. Orders go straight to Hyperliquid via the API wallet — no builder fee, no wallet popup. The bot still places the stop and runs the exit."
        >
          <i data-icon="rising"></i>Trade
        </button>
      </section>

      <!-- 01.5 / Hot Movers — live price spikes + OI delta -->
      <section class="card" id="sec-movers">
        <div class="card-header">
          <div
            class="card-title"
            data-card="Coins with the largest price moves. Setup is a context direction (dump → SHORT, pump → LONG) — NOT a trade: continuation backtests negative."
          >
            Hot Movers
          </div>
          <div class="hm-header-right">
            <span id="hm-actions-slot"></span>
            <span id="hm-tools" class="hm-tools">
              <button
                id="mp-paper-btn"
                class="btn btn--sm"
                type="button"
                data-card="Open a paper trade (your own paper, Rabbit-style): coin, side, leverage, size off equity. The bot doesn't trade it — you run it by hand."
              >
                <i data-icon="add"></i>Paper
              </button>
              <button
                id="whatif-btn"
                class="btn btn--sm"
                type="button"
                data-card="Itchy hands? Type a coin and side — the bot checks it against the fade-high-ER edge and either backs you or stops you"
              >
                What if…
              </button>
            </span>
            <span
              id="hot-movers-meta"
              style="
                font-size: var(--fs-label);
                font-family: var(--font-mono);
                color: var(--text-muted);
              "
            ></span>
          </div>
        </div>
        <div class="u-scroll-x hm-scroll-wrap">
          <table class="table table--sticky-head signals-table hm-table">
            <thead>
              <tr>
                <th style="width: 24px">#</th>
                <th>Coin</th>
                <th
                  class="center"
                  data-card="Fade setup: SHORT/LONG = ready to fade the move; WAIT = waiting for momentum to exhaust"
                >
                  Setup
                </th>
                <th
                  class="center"
                  data-card="Chase meter: how far price has already run IN THE TRADE DIRECTION from the short average (15m, 5m fallback). Lit only on a confirmed setup. Near the base — no chase; stretched — let it pull back; already gone your way — too late, wait for a retrace. You pick the 5m entry yourself."
                >
                  Enter
                </th>
                <th class="num">Price</th>
                <th class="num">2m%</th>
                <th class="num">5m%</th>
                <th class="num">15m%</th>
                <th
                  class="num"
                  data-card="Acceleration: |2m| vs 5m extrapolation. Down = exhausting (fade), up = accelerating (avoid)"
                >
                  Acc
                </th>
                <th
                  class="num"
                  data-card="OI change over 5 minutes. Rising = new positions; falling = closes/liquidations"
                >
                  OI 5m
                </th>
                <th class="num" data-card="15m trend">
                  Trend
                </th>
              </tr>
            </thead>
            <tbody id="hot-movers-tbody">
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>

              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>

      <!-- 01.4 / Screen — монеты, отобранные по цене входа, + бюджет дня.
           Заменяет Hot Movers в роли «куда смотреть»: отбор идёт по трению
           (спред + комиссии), а не по движению. Обоснование и порог —
           routes/screen.js. Предсказаний здесь нет и быть не должно. -->
      <section class="card" id="sec-screen">
        <div class="card-header">
          <div
            class="card-title"
            data-card="Coins where entering is cheap. «Friction» = what share of your risk budget the round trip (book spread + two taker fees) eats. These are NOT signals: the list is filtered by cost of entry, movement is shown as fact — the call is yours."
          >
            Screen
          </div>
          <div class="scr-header-right">
            <span id="screen-actions-slot"></span>
            <span id="screen-meta" class="scr-meta"></span>
          </div>
        </div>
        <div id="screen-budget" class="scr-budget"></div>
        <div class="u-scroll-x">
          <table class="table scr-table">
            <thead>
              <tr>
                <th data-sort="coin" data-card="Sort by ticker">Coin</th>
                <th class="num" data-sort="price" data-card="Sort by price">Price</th>
                <th
                  class="num"
                  data-sort="move"
                  data-card="Short-window move from the bot's live price buffer (15m, falls back to 1h). Sort by size of move."
                >
                  Move
                </th>
                <th class="num" data-sort="chg24h" data-card="Sort by 24h change">24h</th>
                <th
                  class="num"
                  data-sort="friction"
                  data-card="What share of your risk budget the round trip eats: book spread + two taker fees (4.32 bp each). Small print is the raw spread. Sort cheapest first."
                >
                  Friction
                </th>
                <th
                  class="num"
                  data-sort="mine"
                  data-card="Your own track record on this coin: net P&L, number of trades and winrate. Not a prediction about the market — a fact about you."
                >
                  Mine

                <th class="num" data-sort="volume" data-card="Sort by 24h volume">Volume</th>

            </thead>
            <tbody id="screen-tbody">

              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>
              <tr class="sk-row"><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td><td><span class="sk"></span></td></tr>

      <!-- Recent Activity — лента open/close (рендерит index.js через /api/activity).

    <script>
      // ── Header edition stamp (date) ──
      (function () {
        try {
          var d = new Date();
          var ed = d.toISOString().slice(0, 10);
          var hdr = document.querySelector("header[data-edition]");
          if (hdr) hdr.setAttribute("data-edition", ed);
        } catch (_) {}
      })();

      // ── Mobile tape-bar mirror ──
      // Keeps the sticky equity bar in sync with the hero values without touching app.js.
      (function () {
        var heroValue = document.getElementById("equity-value");
        var heroDelta = document.getElementById("equity-delta");
        var modePill = document.getElementById("mode-pill");
        var tapeValue = document.getElementById("tape-equity");
        var tapeDelta = document.getElementById("tape-delta");
        var tapeMode = document.getElementById("tape-mode");
        if (!heroValue || !tapeValue) return;

        function sync() {
          if (heroValue && tapeValue)
            tapeValue.textContent = heroValue.textContent.trim();
          if (heroDelta && tapeDelta) {
            tapeDelta.textContent = heroDelta.textContent.trim();
            tapeDelta.className =
              "tape-delta " +
              (heroDelta.classList.contains("positive")
                ? "positive"
                : heroDelta.classList.contains("negative")
                  ? "negative"
                  : "");
          }
          if (modePill && tapeMode)
            tapeMode.textContent = modePill.textContent.trim();
        }

        var mo = new MutationObserver(sync);
        mo.observe(heroValue, {
          childList: true,
          characterData: true,
          subtree: true,
        });
        if (heroDelta)
          mo.observe(heroDelta, {
            childList: true,
            characterData: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["class"],
          });
        if (modePill)
          mo.observe(modePill, {
            childList: true,
            characterData: true,
            subtree: true,
          });
        sync();
      })();

      // ── Bottom-nav scroll-spy ──
      (function () {
        var nav = document.querySelector(".bottom-nav");
        if (!nav) return;
        var btns = Array.prototype.slice.call(
          nav.querySelectorAll("[data-target]"),
        );
        var sections = btns
          .map(function (b) {
            return document.getElementById(b.dataset.target);
          })
          .filter(Boolean);

        btns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            var el = document.getElementById(btn.dataset.target);
            if (!el) return;
            var y = el.getBoundingClientRect().top + window.pageYOffset - 70;
            window.scrollTo({ top: y, behavior: "smooth" });
          });
        });

        if (!("IntersectionObserver" in window)) return;

        var observer = new IntersectionObserver(
          function (entries) {
            // Pick the entry closest to top of viewport that is currently intersecting.
            var visible = entries
              .filter(function (e) {
                return e.isIntersecting;
              })
              .sort(function (a, b) {
                return a.boundingClientRect.top - b.boundingClientRect.top;
              })[0];
            if (!visible) return;
            var id = visible.target.id;
            btns.forEach(function (b) {
              b.classList.toggle("active", b.dataset.target === id);
            });
          },
          { rootMargin: "-30% 0px -55% 0px", threshold: 0 },
        );

        sections.forEach(function (s) {
          observer.observe(s);
        });
      })();
    </script>

    <script>
      // ── Radar accordions: persist open/closed + collapsed-header badges ──
      (function () {
        var accs = Array.prototype.slice.call(
          document.querySelectorAll("details.radar-acc"),
        );
        if (!accs.length) return;
        var KEY = "hl-radar-acc";
        var state = {};
        try {
          state = JSON.parse(localStorage.getItem(KEY) || "{}");
        } catch (_) {}

        function updateBadge(d) {
          var badge = d.querySelector(":scope > summary .radar-badge");
          if (!badge) return;
          var rows = d.querySelectorAll("tbody tr");
          var real = 0,
            first = "";
          Array.prototype.forEach.call(rows, function (r) {
            if (r.querySelector(".empty-state")) return;
            real++;
            if (!first) {
              var pair = r.querySelector("td:nth-child(2)");
              if (pair) first = pair.textContent.trim();
            }
          });
          badge.textContent = real ? (first ? first + " · " : "") + real : "";
        }

        accs.forEach(function (d) {
          var id = d.dataset.acc || d.id;
          // По умолчанию свёрнуто (declutter); восстанавливаем сохранённое.
          if (state[id] === true) d.setAttribute("open", "");
          else d.removeAttribute("open");

          d.addEventListener("toggle", function () {
            state[id] = d.open;
            try {
              localStorage.setItem(KEY, JSON.stringify(state));
            } catch (_) {}
            if (!d.open) updateBadge(d);
          });

          // Клик по «?»-кнопке в шапке не должен сворачивать аккордеон.
          var help = d.querySelector("summary .help-btn");
          if (help)
            help.addEventListener("click", function (e) {
              e.stopPropagation();
            });
        });

        function refresh() {
          accs.forEach(function (d) {
            if (!d.open) updateBadge(d);
          });
        }
        setInterval(refresh, 3000);
        refresh();
      })();
    </script>

    <!-- Motion layer: reveal-on-scroll со стаггером. Только transform/opacity,
         IntersectionObserver (не на каждый кадр) → дёшево и стабильно 60fps.
         JS сам ставит data-reveal, поэтому без JS контент остаётся видимым. -->
    <script>
      (function () {
        var reduce =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var targets = [].slice.call(
          document.querySelectorAll("section.card, #market-context")
        );
        if (reduce || !("IntersectionObserver" in window) || !targets.length)
          return;

        targets.forEach(function (el) {
          el.setAttribute("data-reveal", "");
        });

        var vh = window.innerHeight || 800;
        var firstScreen = 0;
        var io = new IntersectionObserver(
          function (entries, obs) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              var el = entry.target;
              // Стаггерим только то, что уже в первом экране на старте;
              // карточки ниже всплывают по одной по мере доскролла.
              var rect = el.getBoundingClientRect();
              if (rect.top < vh) {
                el.style.setProperty("--reveal-i", firstScreen++);
              }
              el.classList.add("is-revealed");
              obs.unobserve(el);
              // Вход доигран → снимаем data-reveal совсем. Атрибут держит на
              // элементе transition по transform/opacity, а живой transition —
              // это повод для браузера не отпускать композиторный слой. Ровно
              // он и давал мигающую полоску на плашке BTC (см. _motion.scss).
              var drop = function () {
                el.removeAttribute("data-reveal");
                el.style.removeProperty("--reveal-i");
              };
              el.addEventListener("transitionend", drop, { once: true });
              // Страховка: если transitionend не придёт (вкладка в фоне —
              // таймлайн анимаций там стоит), чистим по таймеру.
              setTimeout(drop, 1500);
            });
          },
          { threshold: 0.08, rootMargin: "0px 0px -8% 0px" }
        );

        targets.forEach(function (el) {
          io.observe(el);
        });
      })();
    </script>

    <script type="module" src="/index.js"></script>
