<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0c0a09"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f5f1ea"
      media="(prefers-color-scheme: light)"
    />
    <title>Ledger · Helm</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hl-scanner-theme") || "auto";
          var theme =
            stored === "auto"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored === "light"
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="container">
      <nav class="topnav" id="topnav" aria-label="Primary"></nav>

      <div class="ledger-head">
        <div>
          <h1>Monthly Ledger</h1>
          <div class="sub">
            Source: Hyperliquid on-chain fills · since
            <span id="start-date">…</span>
          </div>
        </div>
      </div>

      <div class="summary-grid" id="summary"></div>

      <div class="table-card">
        <div id="table-host">
          <div class="loading">Loading fills from Hyperliquid…</div>
        </div>
      </div>

      <!-- Tax Summary (перенесено с дашборды; рендерит app.js через /api/tax-summary) -->
      <section class="card">
        <div class="card-header">
          <div class="card-title" data-num="">
            Tax Summary
            <span
              style="
                font-size: 14px;
                color: var(--text-muted);
                font-family: var(--font-mono);
                font-style: normal;
                letter-spacing: 0.08em;
              "
              >PIT-38</span
            >
          </div>
          <div id="tax-year" class="tax-year-label">2026</div>
        </div>
        <div class="data-grid">
          <div class="grid-item">
            <div class="item-label">Koszty (Costs)</div>
            <div class="item-value" id="tax-costs">0.00 PLN</div>
          </div>
          <div class="grid-item">
            <div class="item-label">Przychody (Revenue)</div>
            <div class="item-value" id="tax-revenue">0.00 PLN</div>
          </div>
          <div class="grid-item">
            <div class="item-label">Profit / Loss</div>
            <div class="item-value" id="tax-profit">0.00 PLN</div>
          </div>
          <div class="grid-item">
            <div class="item-label">Est. Tax (19%)</div>
            <div class="item-value" id="tax-est" style="color: var(--green)">
              0.00 PLN
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Trade detail modal (для кликов по Recent Activity) -->
    <div id="trade-modal" class="trade-modal" hidden>
      <div class="trade-modal__backdrop" data-close="1"></div>
      <div class="trade-modal__panel" role="dialog" aria-modal="true">
        <button class="trade-modal__close" data-close="1" aria-label="Close">
          ×
        </button>
        <div id="trade-modal-body"></div>
      </div>
    </div>

    <script>
      const fmt = (n, sign = true) => {
        if (n == null || isNaN(n)) return "—";
        const s =
          (n < 0 ? "-" : sign && n > 0 ? "+" : "") +
          "$" +
          Math.abs(n).toFixed(2);
        return s;
      };
      const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "dim");
      const monthLabel = (k) => {
        const [y, m] = k.split("-");
        const names = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        return names[parseInt(m, 10) - 1] + " " + y;
      };

      function renderSummary(t) {
        const cards = [
          {
            k: "Net P&L · all time",
            v: fmt(t.net),
            c: cls(t.net),
            sub: "after fees + funding",
          },
          {
            k: "Bot net",
            v: fmt(t.botNet),
            c: cls(t.botNet),
            sub: `${t.botCount} trades · ${t.botWinRate}% win`,
          },
          {
            k: "Adopted net",
            v: fmt(t.adoptedNet),
            c: cls(t.adoptedNet),
            sub: `${t.adoptedCount} trades · ${t.adoptedWinRate}% win`,
          },
          {
            k: "Manual net",
            v: fmt(t.manualNet),
            c: cls(t.manualNet),
            sub: `${t.manualCount} trades · ${t.manualWinRate}% win`,
          },
          {
            k: "Fees paid",
            v: fmt(-t.fees, false),
            c: "neg",
            sub: "total maker+taker",
          },
          {
            k: "Funding",
            v: fmt(t.funding),
            c: cls(t.funding),
            sub: "funding accrual",
          },
        ];
        document.getElementById("summary").innerHTML = cards
          .map(
            (c) => `
            <div class="stat-card">
              <div class="k">${c.k}</div>
              <div class="v ${c.c}">${c.v}</div>
              <div class="vsub">${c.sub}</div>
            </div>`,
          )
          .join("");
      }

      function row(m) {
        const wr = (w, c) =>
          c
            ? `<span class="sub-meta">${w}/${c} · ${Math.round((100 * w) / c)}%</span>`
            : "";
        const has = (m.days || []).length > 0;
        return `
          <tr class="${m.isCurrent ? "current" : ""} ${has ? "expandable" : ""}"
              ${has ? `data-month="${m.month}" tabindex="0" role="button" aria-expanded="false"` : ""}>
            <td class="month"><span class="twisty">${has ? "▸" : ""}</span>${monthLabel(m.month)}</td>
            <td class="grp-edge ${cls(m.botNet)}">${fmt(m.botNet)}${wr(m.botWins, m.botCount)}</td>
            <td class="col-opt dim">${m.botCount || "—"}</td>
            <td class="grp-edge ${cls(m.adoptedNet)}">${m.adoptedCount ? fmt(m.adoptedNet) : "—"}${wr(m.adoptedWins, m.adoptedCount)}</td>
            <td class="col-opt dim">${m.adoptedCount || "—"}</td>
            <td class="grp-edge ${cls(m.manualNet)}">${fmt(m.manualNet)}${wr(m.manualWins, m.manualCount)}</td>
            <td class="col-opt dim">${m.manualCount || "—"}</td>
            <td class="grp-edge neg">${m.botFees + m.adoptedFees + m.manualFees ? fmt(-(m.botFees + m.adoptedFees + m.manualFees), false) : "—"}</td>
            <td class="col-opt ${cls(m.funding)}">${m.funding ? fmt(m.funding) : "—"}</td>
            <td class="grp-edge net-cell ${cls(m.net)}">${fmt(m.net)}</td>
            <td class="${cls(m.cumulativeNet)}">${fmt(m.cumulativeNet)}</td>
          </tr>
          ${has ? `<tr class="daybreak" data-days="${m.month}" hidden><td colspan="11">${daysBlock(m)}</td></tr>` : ""}`;
      }

      // ── Разворот месяца: дни, сгруппированные по ISO-неделям (Пн–Вс) ──
      const dayLabel = (d) => {
        const dt = new Date(d + "T00:00:00Z");
        const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][
          dt.getUTCDay()
        ];
        return `${wd} ${dt.getUTCDate()}`;
      };
      const weekLabel = (mon) => {
        const a = new Date(mon + "T00:00:00Z");
        const b = new Date(a);
        b.setUTCDate(b.getUTCDate() + 6);
        const mm = (x) =>
          monthLabel(x.toISOString().slice(0, 7)).split(" ")[0];
        return `${mm(a)} ${a.getUTCDate()} – ${mm(b)} ${b.getUTCDate()}`;
      };

      function dayRow(d) {
        const trades = d.botCount + d.adoptedCount + d.manualCount;
        return `
          <tr>
            <td class="day">${dayLabel(d.date)}</td>
            <td class="dim">${trades || "—"}</td>
            <td class="${cls(d.botNet)}">${d.botCount ? fmt(d.botNet) : "—"}</td>
            <td class="${cls(d.adoptedNet)}">${d.adoptedCount ? fmt(d.adoptedNet) : "—"}</td>
            <td class="${cls(d.manualNet)}">${d.manualCount ? fmt(d.manualNet) : "—"}</td>
            <td class="neg">${d.fees ? fmt(-d.fees, false) : "—"}</td>
            <td class="net-cell ${cls(d.net)}">${fmt(d.net)}</td>
          </tr>`;
      }

      function weekRow(mon, days) {
        const sum = (f) => days.reduce((a, d) => a + f(d), 0);
        const net = sum((d) => d.net);
        const trades = sum((d) => d.botCount + d.adoptedCount + d.manualCount);
        const wins = sum((d) => d.botWins + d.adoptedWins + d.manualWins);
        const green = days.filter((d) => d.net > 0).length;
        return `
          <tr class="wk">
            <td class="day">Week ${weekLabel(mon)}</td>
            <td class="dim">${trades || "—"}</td>
            <td class="dim" colspan="3">${trades ? `${wins}/${trades} win · ${green}/${days.length} зелёных дней` : ""}</td>
            <td class="neg">${sum((d) => d.fees) ? fmt(-sum((d) => d.fees), false) : "—"}</td>
            <td class="net-cell ${cls(net)}">${fmt(net)}</td>
          </tr>`;
      }

      function daysBlock(m) {
        const byWeek = new Map();
        for (const d of m.days) {
          if (!byWeek.has(d.week)) byWeek.set(d.week, []);
          byWeek.get(d.week).push(d);
        }
        const body = [...byWeek.entries()]
          .map(
            ([mon, days]) => weekRow(mon, days) + days.map(dayRow).join(""),
          )
          .join("");
        return `
          <table class="daily">
            <thead>
              <tr>
                <th>Day</th><th>#</th><th>Bot</th><th>Adopted</th>
                <th>Manual</th><th>Fees</th><th>Net</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>`;
      }

      function bindExpand(host) {
        const toggle = (tr) => {
          const panel = host.querySelector(
            `tr.daybreak[data-days="${tr.dataset.month}"]`,
          );
          if (!panel) return;
          const open = panel.hidden;
          panel.hidden = !open;
          tr.setAttribute("aria-expanded", String(open));
          tr.querySelector(".twisty").textContent = open ? "▾" : "▸";
        };
        host.addEventListener("click", (e) => {
          const tr = e.target.closest("tr.expandable");
          if (tr) toggle(tr);
        });
        host.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" && e.key !== " ") return;
          const tr = e.target.closest("tr.expandable");
          if (!tr) return;
          e.preventDefault();
          toggle(tr);
        });
      }

      function renderTable(data) {
        const t = data.totals;
        const head = `
          <table class="ledger">
            <thead>
              <tr>
                <th>Month</th>
                <th class="grp">Bot P&L</th>
                <th class="col-opt">#</th>
                <th class="grp" title="Я вошёл, бот подхватил и закрыл (adopt-нянька)">Adopted P&L</th>
                <th class="col-opt">#</th>
                <th class="grp">Manual P&L</th>
                <th class="col-opt">#</th>
                <th class="grp">Fees</th>
                <th class="col-opt">Funding</th>
                <th class="grp">Net</th>
                <th>Cumulative</th>
              </tr>
            </thead>
            <tbody>
              ${data.months.map(row).join("")}
            </tbody>
            <tfoot>
              <tr>
                <td class="month">Total</td>
                <td class="grp-edge ${cls(t.botNet)}">${fmt(t.botNet)}</td>
                <td class="col-opt dim">${t.botCount}</td>
                <td class="grp-edge ${cls(t.adoptedNet)}">${t.adoptedCount ? fmt(t.adoptedNet) : "—"}</td>
                <td class="col-opt dim">${t.adoptedCount}</td>
                <td class="grp-edge ${cls(t.manualNet)}">${fmt(t.manualNet)}</td>
                <td class="col-opt dim">${t.manualCount}</td>
                <td class="grp-edge neg">${fmt(-t.fees, false)}</td>
                <td class="col-opt ${cls(t.funding)}">${fmt(t.funding)}</td>
                <td class="grp-edge net-cell ${cls(t.net)}">${fmt(t.net)}</td>
                <td class="${cls(t.net)}">${fmt(t.net)}</td>
              </tr>
            </tfoot>
          </table>`;
        const host = document.getElementById("table-host");
        host.innerHTML = head;
        bindExpand(host);
      }

      async function load() {
        try {
          const r = await fetch("/api/ledger");
          if (!r.ok) throw new Error("HTTP " + r.status);
          const data = await r.json();
          document.getElementById("start-date").textContent =
            data.startDate || "—";
          if (!data.live || !data.months.length) {
            document.getElementById("table-host").innerHTML =
              '<div class="errbox">Нет данных (бот в PAPER-режиме или fills недоступны).</div>';
            return;
          }
          renderSummary(data.totals);
          renderTable(data);
        } catch (e) {
          document.getElementById("table-host").innerHTML =
            '<div class="errbox">Ошибка загрузки: ' + e.message + "</div>";
        }
      }
      load();
    </script>

    <!-- app.js: рендерит Recent Activity + Tax Summary через tick().
         Остальные секции дашборды отсутствуют → их рендеры делают no-op (guarded). -->
    <script type="module" src="/ledger.js"></script>
  </body>
</html>
