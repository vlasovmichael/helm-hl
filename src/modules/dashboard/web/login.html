<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Sign in · HL Scanner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hl-scanner-theme') || 'auto';
          var theme;
          if (stored === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            theme = stored === 'light' ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--canvas-subtle);
      }
      .login-shell {
        width: 100%;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .login-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-bottom: 4px;
      }
      .login-logo {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-sm);
      }
      .login-logo svg { display: block; }
      .login-wordmark {
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 18px;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }
      .login-card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 28px 24px;
        box-shadow: var(--shadow-sm);
      }
      .login-title {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
        margin-bottom: 4px;
        text-align: center;
        color: var(--text-primary);
      }
      .login-subtitle {
        color: var(--text-muted);
        font-size: 13px;
        text-align: center;
        margin-bottom: 22px;
      }
      .login-error {
        background: var(--red-soft);
        border: 1px solid var(--red-line);
        color: var(--red);
        padding: 8px 12px;
        border-radius: var(--radius);
        font-size: 13px;
        margin-bottom: 14px;
        display: none;
      }
      .login-error.visible { display: block; }
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .login-field { display: flex; flex-direction: column; gap: 6px; }
      .login-field label {
        font-size: 12px;
        color: var(--text-primary);
        font-weight: 600;
      }
      .login-input {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 12px;
        color: var(--text-primary);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 20px;
        transition: border-color 0.12s, box-shadow 0.12s;
        width: 100%;
        outline: none;
      }
      .login-input::placeholder { color: var(--text-muted); }
      .login-input:hover { border-color: var(--border-strong); }
      .login-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .login-button {
        background: var(--green);
        color: #ffffff;
        border: 1px solid color-mix(in srgb, var(--green) 70%, #000);
        border-radius: 6px;
        padding: 7px 16px;
        font-family: var(--font-sans);
        font-weight: 500;
        font-size: 14px;
        line-height: 20px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s, transform 0.06s;
        margin-top: 4px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          0 1px 0 rgba(31, 35, 40, 0.04);
      }
      .login-button:hover {
        background: color-mix(in srgb, var(--green) 90%, #000);
      }
      .login-button:active { transform: translateY(1px); }
      .login-button:disabled { opacity: 0.6; cursor: not-allowed; }

      .login-meta {
        text-align: center;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
        letter-spacing: 0.02em;
      }

      @media (max-width: 480px) {
        body { padding: 16px; }
        .login-shell { max-width: 100%; }
        .login-card { padding: 22px 18px; border-radius: 10px; }
        .login-title { font-size: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-mark">
        <div class="login-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 32 32">
            <path d="M5 23 L11 17 L15 19 L21 11 L27 13" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="27" cy="13" r="2" fill="var(--green)"/>
          </svg>
        </div>
        <div class="login-wordmark">HL Scanner</div>
      </div>

      <div class="login-card">
        <div class="login-title">Sign in</div>
        <div class="login-subtitle">Trading terminal · single user</div>

        <div class="login-error" id="login-error"></div>

        <form class="login-form" id="login-form" method="POST" action="/login">
          <div class="login-field">
            <label for="user">Username</label>
            <input
              class="login-input"
              type="text"
              id="user"
              name="user"
              autocomplete="username"
              autofocus
              required
            />
          </div>
          <div class="login-field">
            <label for="pass">Password</label>
            <input
              class="login-input"
              type="password"
              id="pass"
              name="pass"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="login-button" type="submit" id="login-submit">
            Sign in
          </button>
        </form>
      </div>

      <div class="login-meta">Hyperliquid scanner · v1</div>
    </div>

    <script>
      (function () {
        const form = document.getElementById('login-form');
        const errEl = document.getElementById('login-error');
        const btn = document.getElementById('login-submit');

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
          errEl.textContent = 'Invalid username or password.';
          errEl.classList.add('visible');
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.remove('visible');
          btn.disabled = true;
          btn.textContent = 'Signing in…';
          try {
            const body = new URLSearchParams({
              user: document.getElementById('user').value,
              pass: document.getElementById('pass').value,
            });
            const r = await fetch('/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body,
              redirect: 'manual',
            });
            if (r.status === 204 || r.type === 'opaqueredirect') {
              const next = params.get('next') || '/';
              window.location.href = next;
              return;
            }
            const data = await r.json().catch(() => ({}));
            errEl.textContent = data.error || 'Invalid username or password.';
            errEl.classList.add('visible');
          } catch (_) {
            errEl.textContent = 'Network error. Try again.';
            errEl.classList.add('visible');
          } finally {
            btn.disabled = false;
            btn.textContent = 'Sign in';
          }
        });
      })();
    </script>
  </body>
</html>
