<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Sign in · Helm</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hl-scanner-theme') || 'auto';
          var theme;
          if (stored === 'auto') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } else {
            theme = stored === 'light' ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-mark">
        <div class="login-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 32 32">
            <path d="M5 23 L11 17 L15 19 L21 11 L27 13" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="27" cy="13" r="2" fill="var(--green)"/>
          </svg>
        </div>
        <div class="login-wordmark">Helm</div>
      </div>

      <div class="login-card">
        <div class="login-title">Sign in</div>
        <div class="login-subtitle">Trading terminal · single user</div>

        <div class="login-error" id="login-error"></div>

        <form class="login-form" id="login-form" method="POST" action="/login">
          <div class="login-field">
            <label for="user">Username</label>
            <input
              class="login-input"
              type="text"
              id="user"
              name="user"
              autocomplete="username"
              autofocus
              required
            />
          </div>
          <div class="login-field">
            <label for="pass">Password</label>
            <input
              class="login-input"
              type="password"
              id="pass"
              name="pass"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="login-button" type="submit" id="login-submit">
            Sign in
          </button>
        </form>
      </div>

      <div class="login-meta">Hyperliquid trading copilot</div>
    </div>

    <script>
      (function () {
        const form = document.getElementById('login-form');
        const errEl = document.getElementById('login-error');
        const btn = document.getElementById('login-submit');

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
          errEl.textContent = 'Invalid username or password.';
          errEl.classList.add('visible');
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errEl.classList.remove('visible');
          btn.disabled = true;
          btn.textContent = 'Signing in…';
          try {
            const body = new URLSearchParams({
              user: document.getElementById('user').value,
              pass: document.getElementById('pass').value,
            });
            const r = await fetch('/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body,
              redirect: 'manual',
            });
            if (r.status === 204 || r.type === 'opaqueredirect') {
              const next = params.get('next') || '/';
              window.location.href = next;
              return;
            }
            const data = await r.json().catch(() => ({}));
            errEl.textContent = data.error || 'Invalid username or password.';
            errEl.classList.add('visible');
          } catch (_) {
            errEl.textContent = 'Network error. Try again.';
            errEl.classList.add('visible');
          } finally {
            btn.disabled = false;
            btn.textContent = 'Sign in';
          }
        });
      })();
    </script>
    <script type="module" src="/login.js"></script>
  </body>
</html>
