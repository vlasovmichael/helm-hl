<!doctype html>
<html lang="en">
  <head>
    <!--#head-->
    <title>Sign in · Helm</title>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-mark">
        <div class="login-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 32 32">
            <path d="M5 23 L11 17 L15 19 L21 11 L27 13" fill="none" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="27" cy="13" r="2" fill="var(--green)"/>
          </svg>
        </div>
        <div class="login-wordmark">Helm</div>
      </div>

      <div class="login-card">
        <div class="login-title">Sign in</div>
        <div class="login-subtitle">Trading terminal · single user</div>

        <div class="login-error" id="login-error"></div>

        <form class="login-form" id="login-form" method="POST" action="/login">
          <div class="login-field">
            <label for="user">Username</label>
            <input
              class="login-input"
              type="text"
              id="user"
              name="user"
              autocomplete="username"
              autofocus
              required
            />
          </div>
          <div class="login-field">
            <label for="pass">Password</label>
            <input
              class="login-input"
              type="password"
              id="pass"
              name="pass"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn btn--primary btn--lg login-button" type="submit" id="login-submit">
            Sign in
          </button>
        </form>
      </div>

      <div class="login-meta">Hyperliquid trading copilot</div>
    </div>

    <script type="module" src="/login.js"></script>
  </body>
</html>
