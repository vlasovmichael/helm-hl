services:
  hl-paper-scanner:
    build: .
    container_name: hl-paper-scanner
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - gateway_net
      - tax_net

  # Spike-Fade наблюдатель — бумажный замер «скальпа фитилей». Отдельный
  # процесс (НЕ трогает торгового бота): свой WS к HL allMids, ноль ордеров,
  # пишет события в общий data-том (data/spike-fade/events.jsonl), которые
  # дашборд показывает на /lab (/api/spike-fade). Параметры — через .env
  # (SPIKE_PCT, SPIKE_TARGET_PCT, SPIKE_STOP_PCT, SPIKE_HORIZON_MS…).
  spike-fade:
    build: .
    container_name: hl-spike-fade
    restart: unless-stopped
    command: node tools/spikeFadeMeasure.mjs
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ./data:/app/data
    # Не веб-сервер → HEALTHCHECK из Dockerfile (пинг :3010) тут не применим.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - gateway_net

  tui:
    profiles: [tui]
    build:
      context: .
      args:
        INCLUDE_DEV: "true"
    container_name: hl-tui
    restart: "no"
    tty: true
    stdin_open: true
    command: node tools/tui.js
    # The TUI reuses the app image but runs the terminal UI, not the web server,
    # so the Dockerfile HEALTHCHECK (pings :3010/api/health) would always fail and
    # Docker would mark this container "unhealthy". Disable it for the TUI.
    healthcheck:
      disable: true
    environment:
      DASHBOARD_URL: http://hl-paper-scanner:3010
      DASHBOARD_AUTH_USER: ${DASHBOARD_USER:-}
      DASHBOARD_AUTH_PASS: ${DASHBOARD_PASS:-}
    depends_on:
      - hl-paper-scanner
    networks:
      - gateway_net

networks:
  gateway_net:
    name: gateway_net
    external: true
  tax_net:
    name: tax_net
    external: true
