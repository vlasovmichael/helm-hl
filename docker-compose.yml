version: "3.8"
services:
  hl-paper-scanner:
    build: .
    container_name: hl-paper-scanner
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - gateway_net
      - tax_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    command: tunnel --protocol http2 --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - gateway_net

  tui:
    profiles: [tui]
    build:
      context: .
      args:
        INCLUDE_DEV: "true"
    container_name: hl-tui
    restart: "no"
    tty: true
    stdin_open: true
    command: node tools/tui.js
    # The TUI reuses the app image but runs the terminal UI, not the web server,
    # so the Dockerfile HEALTHCHECK (pings :3010/api/health) would always fail and
    # Docker would mark this container "unhealthy". Disable it for the TUI.
    healthcheck:
      disable: true
    environment:
      DASHBOARD_URL: http://hl-paper-scanner:3010
      DASHBOARD_AUTH_USER: ${DASHBOARD_USER:-}
      DASHBOARD_AUTH_PASS: ${DASHBOARD_PASS:-}
    depends_on:
      - hl-paper-scanner
    networks:
      - gateway_net

networks:
  gateway_net:
    name: gateway_net
    external: true
  tax_net:
    name: tax_net
    external: true
