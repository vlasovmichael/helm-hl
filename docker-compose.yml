version: "3.8"
services:
  hl-paper-scanner:
    build: .
    container_name: hl-paper-scanner
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - proxy_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true
