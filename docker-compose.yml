version: "3.8"
services:
  hl-paper-scanner:
    build: .
    container_name: hl-paper-scanner
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - workspace_app_network

networks:
  workspace_app_network:
    external: true
