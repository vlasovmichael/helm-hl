services:
  hl-paper-scanner:
    build: .
    container_name: hl-paper-scanner
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      # Потолок кучи задаём САМИ, а не отдаём на откуп ноде.
      #
      # Why (10.08.2026, третье и четвёртое падения): Node выводит heap_size_limit
      # из cgroup и при лимите 512М ставил себе 259М. Рабочая база бота — heap
      # 140-170М при rss 230-260, то есть процесс постоянно жил ВПЛОТНУЮ к
      # потолку, и любой залп его убивал. Между падениями было 1д 8ч, потом 37
      # минут — время смерти стало лотереей.
      #
      # 440М кучи + ~85М оверхеда ≈ 525М rss, поэтому cgroup поднят до 768М:
      # нужен запас и на сам снимок кучи, который пишется в момент упора.
      # Снимок (--heapsnapshot-near-heap-limit=1, один на запуск) уходит в
      # /app/data — это смонтированный том, он переживёт рестарт. Без него
      # виновника залпа назвать нечем: [Mem] раз в 10 минут крупнее события.
      NODE_OPTIONS: >-
        --max-old-space-size=440
        --heapsnapshot-near-heap-limit=1
        --diagnostic-dir=/app/data
    # Docker по умолчанию даёт на остановку 10 секунд, а уборка у бота из шести
    # шагов: дождаться тика, снять позицию из БД, сохранить стейт, проверить
    # защитные ордера на бирже, отбить Telegram и слить WAL. В десять секунд она
    # не укладывалась НИ РАЗУ (2026-08-11) — процесс добивался SIGKILL'ом на
    # шаге 1/6. Первопричину (висящий server.close при живом WebSocket) починили
    # в dashboard/server.js; это второй пояс на случай медленной сети или биржи.
    stop_grace_period: 90s
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    deploy:
      resources:
        limits:
          # 256M упирался в потолок за ~1.5 суток → тихий OOM-kill и рестарт
          # (01.08 и 02.08). 512M сдвинул режим отказа на потолок кучи V8 (09.08,
          # 10.08 дважды). 768M — чтобы связывающим стал заданный нами
          # --max-old-space-size, а не случайное число от ноды. Хост свободен
          # (19 ГБ из 24).
          memory: 768M
    ports:
      - "127.0.0.1:3010:3010"
    networks:
      - gateway_net
      - tax_net

  # Liquidation-Wick Collector — форвард-замер фейда ликвидационных фитилей.
  # Отдельный процесс (НЕ трогает торгового бота): свой poll 1m-свечей HL, ноль
  # ордеров. Детект по low/high закрытой свечи + лимит-модель входа, ведение до
  # target/stop/timeout. Пишет в общий data-том (data/liq-wick/events.jsonl),
  # дашборд показывает на /lab (/api/spike-fade). Параметры — через .env
  # (LIQ_WICK_PCT, LIQ_TARGET_PCT, LIQ_STOP_PCT, LIQ_HORIZON_MIN, LIQ_COINS…).
  # Предшественник (spikeFadeMeasure, mid-based) снят — мерил не то (см. memory).
  liq-wick:
    build: .
    container_name: hl-liq-wick
    restart: unless-stopped
    command: node tools/liqWickCollector.mjs
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - ./data:/app/data
    # Не веб-сервер → HEALTHCHECK из Dockerfile (пинг :3010) тут не применим.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - gateway_net

  tui:
    profiles: [tui]
    build:
      context: .
      args:
        INCLUDE_DEV: "true"
    container_name: hl-tui
    restart: "no"
    tty: true
    stdin_open: true
    command: node tools/tui.js
    # The TUI reuses the app image but runs the terminal UI, not the web server,
    # so the Dockerfile HEALTHCHECK (pings :3010/api/health) would always fail and
    # Docker would mark this container "unhealthy". Disable it for the TUI.
    healthcheck:
      disable: true
    environment:
      DASHBOARD_URL: http://hl-paper-scanner:3010
      DASHBOARD_AUTH_USER: ${DASHBOARD_USER:-}
      DASHBOARD_AUTH_PASS: ${DASHBOARD_PASS:-}
    depends_on:
      - hl-paper-scanner
    networks:
      - gateway_net

  # Postgres под durable execution (docs/dbos-durable-plan.md, шаг 3).
  # ПОД ПРОФИЛЕМ: обычный `docker compose up -d` его НЕ поднимает. Включается
  # осознанно — `docker compose --profile dbos up -d dbos-db` — когда дойдём до
  # тени (шаг 4). До тех пор это заготовка, а не работающий сервис.
  #
  # Своя база, а не tax-postgres: там налоговый реестр, и мешать с ним состояние
  # торгового бота незачем — разные бэкапы, разные последствия у потери.
  # Замер роста: строка чекпоинта ≈ 482 байта, 2-секундная петля даёт ~21 МБ в
  # сутки на позицию. Поэтому прополка обязательна, см. план.
  dbos-db:
    profiles: [dbos]
    image: postgres:16-alpine
    container_name: hl-dbos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbos
      # Пароль лежит в .env на сервере (сгенерирован `openssl rand -hex 32` —
      # 32 байта энтропии, 64 символа в hex). В репо его нет и быть не должно.
      POSTGRES_PASSWORD: ${DBOS_DB_PASSWORD}
      POSTGRES_DB: dbos_hl
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - dbos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dbos -d dbos_hl']
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - gateway_net

volumes:
  dbos_pgdata:
    name: hl_dbos_pgdata

networks:
  gateway_net:
    name: gateway_net
    external: true
  tax_net:
    name: tax_net
    external: true
